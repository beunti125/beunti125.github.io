<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essensplan">
<meta name="theme-color" content="#07090D">
<title>Mein Essensplan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Handy-App mit fester Navigation unten; ein Bildschirm pro Bereich (Heute, Einkauf, Rezepte, Vorrat) */
:root{
  /* Ein festes Theme: Schwarz mit Blau */
  --bg:#07090D;
  --surface:#11151D;
  --ink:#EDF2FA;
  --muted:#8995A8;
  --line:#1F2633;
  --accent:#3B82F6;
  --accent-ink:#FFFFFF;
  --hi:#5AB0FF;
  --hi-soft:#0E1E36;
  --accent-soft:#102341;
  --tile:#18202D;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.45);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:800}
h3{font-size:13px;font-weight:600;font-family:var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sub{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.acchead{all:unset;display:flex;flex-direction:column;gap:6px;cursor:pointer;width:100%;box-sizing:border-box}
.acchead:focus-visible{outline:3px solid var(--hi);outline-offset:4px;border-radius:8px}
.acchead .chev{transform:rotate(135deg);transition:transform .2s}
.acchead .chev.up{transform:rotate(-45deg)}
.rbody{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;display:flex;flex-direction:column;gap:4px}
.rbody .steps li{font-size:16px}
.card.tap{width:100%;text-align:left;font:inherit;color:inherit}
.card.tap:active{transform:scale(.99)}
.card.cook{border-color:var(--hi);box-shadow:inset 4px 0 0 var(--hi)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dish{font-size:18px;font-weight:700}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--hi-soft);color:var(--ink);border:1px solid var(--hi);white-space:nowrap}
.pill.green{background:var(--accent-soft);border-color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-align:left}
.tasks{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;gap:8px;font-size:15px}
.tasks li::before{content:"";flex:0 0 8px;height:8px;margin-top:7px;border-radius:2px;background:var(--hi)}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.banner .btn{background:var(--accent-ink);color:var(--accent);align-self:flex-start}
/* Tagesleiste */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-height:52px}
.day b{font-size:15px}
.day.cookday{border-color:var(--hi)}
.day.today b{color:var(--accent)}
.day.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.day.sel b{color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:var(--hi)}
/* Segmente */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:38px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Einkauf */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum .card{gap:2px}
.big{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.section{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;text-align:left;width:100%;min-height:56px}
.box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.item[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.item[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border-left:3px solid var(--accent-ink);border-bottom:3px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.item .txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.item .n{font-weight:600}
.item .q{font-size:13px;color:var(--muted)}
.item .p{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);white-space:nowrap}
.item[aria-pressed="true"]{opacity:.55}
.item[aria-pressed="true"] .n{text-decoration:line-through}
/* Rezepte */
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;width:100%;text-align:left;min-height:60px}
.ritem .n{font-weight:700;font-size:17px}
.ritem .t{font-size:13px;color:var(--muted)}
.chev{width:9px;height:9px;border-right:2.5px solid var(--muted);border-top:2.5px solid var(--muted);transform:rotate(45deg);flex:0 0 auto}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;display:none}
.sheet.open{display:block}
.sheet main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.back{position:sticky;top:0;z-index:2;background:var(--bg);width:100%;display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0;margin-bottom:8px;min-height:44px}
.back::before{content:"";width:9px;height:9px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing li{padding:9px 0;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;font-size:17px;line-height:1.5}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:15px;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tip{background:var(--hi-soft);border:1px solid var(--hi);border-radius:12px;padding:12px 14px;font-weight:600}
/* Vorrat */
.stock{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ctr{display:flex;align-items:center;gap:10px}
.ctr button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.ctr output{font-family:var(--display);font-size:26px;font-weight:800;min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;z-index:10}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;min-height:52px;justify-content:center}
nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:var(--tile);display:grid;place-items:center}
.ico svg{width:30px;height:30px}
.ico.s{width:36px;height:36px;border-radius:11px}.ico.s svg{width:24px;height:24px}
.ico.xs{width:26px;height:26px;border-radius:8px;background:transparent}.ico.xs svg{width:24px;height:24px}
.ico.xl{width:84px;height:84px;border-radius:26px;margin-bottom:12px}.ico.xl svg{width:58px;height:58px}
.mealrow{display:flex;align-items:center;gap:12px}
.sech{display:flex;align-items:center;gap:6px}


.nut{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px;margin:4px 0 10px}
.nut div{background:var(--tile);border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.nut b{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.nut span{font-size:11px;color:var(--muted)}
.nut .price{background:var(--accent-soft);outline:1px solid var(--accent)}
/* Technik */
.tprog{height:4px;background:#1b2433}
.tprog i{display:block;height:100%;width:0;background:var(--accent);animation:tp 3.4s linear forwards}
.tprog i.full{width:100%;animation:none;background:#2a3b57}
@keyframes tp{to{width:100%}}
.tlinks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tacc{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.tacc.big{background:var(--surface);padding:0}
.ttog{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;font-weight:700}
.tacc.big .ttog{padding:14px 16px}
.ttog:focus-visible{outline:3px solid var(--hi);outline-offset:-3px}
.ttog .chev{transform:rotate(135deg);transition:transform .2s}
.ttog[aria-expanded="true"] .chev{transform:rotate(-45deg)}
.tslot .tplayer{padding:0 12px 12px}
.tacc.big .tslot .tplayer{padding:0 16px 16px}

.tstage{border-radius:12px;overflow:hidden;margin:8px 0 4px}
.tstage svg{display:block;width:100%;height:auto}
.tstage [data-show]{transition:opacity .45s}
.tstage .fadein{opacity:0;transition:opacity .35s}
.tstage .on .fadein{opacity:1}
.tcap{margin:8px 0 6px;font-weight:600;min-height:3em;font-size:15px}
.tdots{display:flex;gap:6px}
.tdot{width:12px;height:12px;border-radius:50%;border:0;background:var(--line);padding:0}
.tdot.on{background:var(--accent)}
.lbl{fill:#9fb0c6;font:600 11px var(--body)}
.ttxt{fill:#5ab0ff;font:800 16px var(--display)}
.warn{fill:#f2b53a;font:800 13px var(--display);letter-spacing:.06em}
.chop{animation:chop .55s ease-in-out infinite}
@keyframes chop{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}
.slide{animation:slide 2.4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-28px)}to{transform:translateX(28px)}}
.flame{animation:flick .4s ease-in-out infinite alternate;transform-origin:150px 168px}
@keyframes flick{from{transform:scaleY(.85)}to{transform:scaleY(1.1)}}
.steam path{stroke:#9fb0c6;stroke-width:2;fill:none;opacity:.6;animation:rise 1.8s ease-in infinite}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes rise{from{transform:translateY(8px);opacity:0}40%{opacity:.7}to{transform:translateY(-12px);opacity:0}}
.smoke path{stroke:#c9d2dc}
.bubbles circle{fill:#d6ecff;animation:bub 1.2s ease-in infinite}
.bubbles circle:nth-child(2){animation-delay:.4s}.bubbles circle:nth-child(3){animation-delay:.8s}
@keyframes bub{from{transform:translateY(4px);opacity:1}to{transform:translateY(-10px);opacity:0}}
.sizzle circle{fill:#ffd36b;animation:bub .8s ease-in infinite}
.brown{fill:#f3e1b8;transition:fill 2.5s}
.on .brown{fill:#c98a3a}
.chick{fill:#f2b8a8;transition:fill 2s}
.on .chick{fill:#c9772f}
.slice{fill:#efd59a;stroke:#c99a4a;stroke-width:1.2;transition:fill 2.5s}
[data-s="3"] .slice{fill:#d08f2f}
.schn{transition:transform 1.1s ease-in-out;transform:translate(70px,112px)}
.schnbody{fill:#f2b8a8;transition:fill .8s .6s}
[data-s="1"] .schn{transform:translate(70px,112px)}[data-s="1"] .schnbody{fill:#f7efe4}
[data-s="2"] .schn{transform:translate(160px,112px)}[data-s="2"] .schnbody{fill:#f6dc8a}
[data-s="3"] .schn{transform:translate(250px,112px)}[data-s="3"] .schnbody{fill:#c99a5a}
.patty{transform-origin:150px 122px;transition:transform .5s}
.pattybody{fill:#c96a5a;transition:fill 2s}
[data-s="1"] .patty,[data-s="2"] .patty,[data-s="3"] .patty{transform:scale(2.1,.55)}
[data-s="2"] .pattybody,[data-s="3"] .pattybody{fill:#7a3e25}
.press{transition:transform .5s;transform:translateY(-10px)}
[data-s="1"] .press{transform:translateY(70px)}
[data-s="2"] .press,[data-s="3"] .press{transform:translateY(-60px)}
.cheese{opacity:0;transition:opacity .6s .4s}
[data-s="3"] .cheese{opacity:1}
.stk{transition:transform .8s;transform:translate(150px,112px)}
.stkbody{fill:#c96a5a;transition:fill 1.5s}
[data-s="1"] .stk{transform:translate(150px,112px)}
[data-s="2"] .stk{transform:translate(150px,112px) scaleY(-1)}[data-s="2"] .stkbody{fill:#7a3e25}
[data-s="3"] .stk{transform:translate(150px,114px)}[data-s="3"] .stkbody{fill:#6e3520}
[data-s="1"] .stkbody{fill:#9a4e32}
.spoon{animation:baste 1s ease-in-out infinite alternate;transform-origin:228px 64px}
@keyframes baste{from{transform:rotate(-8deg)}to{transform:rotate(12deg)}}
.water{fill:#dfe9f2;transition:fill 1.5s}
.on .water{fill:#bcd8f0}
.swirl{animation:sw 1.4s ease-in-out infinite alternate;transform-origin:160px 100px}
@keyframes sw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.lid{transition:transform .6s,opacity .6s;opacity:0;transform:translateY(-30px)}
[data-s="2"] .lid,[data-s="3"] .lid{opacity:1;transform:translateY(0)}
.wlevel{transition:height 1s,y 1s}
[data-s="3"] .wlevel{opacity:0}
@media (prefers-reduced-motion: reduce){.chop,.slide,.flame,.steam path,.bubbles circle,.sizzle circle,.spoon,.swirl{animation:none}}
.view{display:none}
.view.on{display:block}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<main>
  <section id="v-heute" class="view"></section>
  <section id="v-einkauf" class="view"></section>
  <section id="v-rezepte" class="view"></section>
  <section id="v-technik" class="view"></section>
  <section id="v-vorrat" class="view"></section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="r-title"><main id="sheet-body"></main></div>

<nav aria-label="Bereiche">
  <a href="#heute" data-v="heute"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Heute</a>
  <a href="#einkauf" data-v="einkauf"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 11h10l2-8H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Einkauf</a>
  <a href="#rezepte" data-v="rezepte"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>Rezepte</a>
  <a href="#technik" data-v="technik"><svg viewBox="0 0 24 24"><path d="M4 20 15 9"/><path d="M15 9l3-5 2 2-5 3"/><circle cx="7" cy="7" r="3"/></svg>Technik</a>
  <a href="#vorrat" data-v="vorrat"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 10h14M9 6v1.5M9 13v3"/></svg>Vorrat</a>
</nav>

<script>
"use strict";
/* ---------- Speicher (nur auf diesem Gerät) ---------- */
var mem = {};
function load(k, d){ try{ var v = localStorage.getItem("ep:"+k); return v===null ? (k in mem ? mem[k] : d) : JSON.parse(v);}catch(e){ return k in mem ? mem[k] : d; } }
function save(k, v){ mem[k]=v; try{ localStorage.setItem("ep:"+k, JSON.stringify(v)); }catch(e){} }

/* ---------- Rezepte ---------- */
var R = {
  oats:{name:"Müsli mit Joghurt", time:"1 Min.", por:"1 Portion · ca. 550 kcal",
    ing:["250 g Joghurt oder Skyr","80 g Müsli","Süßungsmittel nach Geschmack"],
    steps:["Joghurt in eine Schüssel, Süßungsmittel unterrühren.","Müsli drüber – fertig.","Für die Uni: Joghurt in eine Box, Müsli separat in ein kleines Glas, erst kurz vorm Essen mischen."],
    tip:"Mit Skyr statt normalem Joghurt hast du fast dreimal so viel Eiweiß (ca. 30 g statt 12 g) und bist länger satt – schmeckt mit Süßungsmittel fast gleich."},
  drumsticks:{name:"Ofen-Drumsticks mit zwei Dips", time:"15 Min. + 45 Min. Ofen", por:"4 Portionen (ca. 5 Stück pro Portion)",
    ing:["2,4 kg Hähnchenunterschenkel (ca. 20 Stück)","3 EL Öl, 2 EL Honig, 2 EL Sojasoße","2 TL Paprikapulver (geräuchert, wenn da), 2 TL Knoblauchpulver, 1 TL Salz, 1 TL Chiliflocken","2 kg Kartoffeln für Wedges","Dip 1 – Honig-Senf: 150 g Skyr, 2 EL Mayo, 2 EL Senf, 2 EL Honig","Dip 2 – Knoblauch-Kräuter: 150 g Skyr, 1 TL Knoblauchpulver, Kräuter, Salz, Spritzer Zitrone"],
    steps:["Ofen auf 210 °C Umluft. Drumsticks trocken tupfen – trocken = knusprig.","Öl, Honig, Sojasoße und Gewürze verrühren, Drumsticks darin wenden.","Mit Abstand auf ein Blech mit Backpapier legen. Kartoffeln in Spalten schneiden, mit Öl, Salz und Paprika aufs zweite Blech.","Beides 40–45 Min. backen, nach 20 Min. wenden. Fertig, wenn die Haut dunkel-knusprig ist.","Dips jeweils verrühren und in kleine Gläser füllen.","In 4 Boxen: Drumsticks und Wedges, Dips getrennt."],
    tip:"Für die letzten 5 Min. den Grill im Ofen anmachen – dann wird die Haut richtig crispy. Kalt in der Uni schmecken sie mit Dip trotzdem gut."},
  sesam:{name:"Honig-Sesam-Chicken mit Sticky-Reis", time:"30 Min.", por:"4 Portionen",

var DOW = ["So","Mo","Di","Mi","Do","Fr","Sa"];
var DOW_LONG = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var DAY = 86400000;
function today(){ var d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseD(s){ var p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtShort(d){ return d.getDate()+"."+(d.getMonth()+1)+"."; }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function nextSunday(d){ return addDays(d, (7-d.getDay())%7); }
function startDate(){ var s=load("start", null); if(!s){ s=fmtISO(nextSunday(today())); save("start", s); } return parseD(s); }
function daysBetween(a,b){ return Math.round((b-a)/DAY); }
var NW=6;
function mod4(n){ return ((n%NW)+NW)%NW; }
function absWeek(d){ return Math.floor(daysBetween(startDate(), d)/7); }
function rot(abs){ return mod4(abs)+1; }
function eur(n){ return n.toFixed(2).replace(".",",")+" €"; }

/* ---------- Tagesplan ---------- */
function dayPlan(r, dow){
  // Stundenplan berücksichtigt: Mi meist frei (Kochtag), Do/Fr lange Uni-Tage bis 17 Uhr (Box + Snack), Mo/Di meist mittags zu Hause.
  var w=W[r], p={breakfast:dow===0?["Brötchen mit Aufschnitt","broetchen"]:(dow===6?["Nougat Bits mit Milch","nougat"]:["Müsli mit Joghurt","oats"]), snack:"Skyr mit Honig oder 1–2 Bananen", tasks:[], cook:false, lunchLabel:"Mittags"};
  var bk = w.mi||["Bratkartoffeln + Speck, Spiegeleier & Bohnen","bratkartoffeln"];
  if(dow===0){ p.lunch=w.sun||["Kaiserschmarrn","kaiserschmarrn"]; p.dinner=w.bowl; p.cook=true;
    p.tasks=["Kochen: "+w.bowl[0]+" – 4 Portionen (heute Abend, Mo mittags + abends, Di mittags).","1,5 kg Kartoffeln mit Schale 20 Min. vorkochen, kalt stellen (für Mittwoch)."]; }
  if(dow===1){ p.lunch=w.bowl; p.dinner=w.bowl; p.tasks=["Kein Kochen heute – nur aufwärmen. Falls du mittags noch in der Uni bist: Box mitnehmen."]; }
  if(dow===2){ p.lunch=w.bowl; p.dinner=w.wrap; p.cook=true;
    p.tasks=["Kochen: "+w.wrap[0]+" – 4 Portionen (heute Abend, Do + Fr Uni-Box, 1 Reserve für einen langen Uni-Tag)."]; if(w.extra&&w.extra[3]) p.tasks.push(w.extra[3]); }
  if(dow===3){ p.lunch=bk; p.dinner=w.pasta; p.cook=true;
    p.tasks=[w.mi?"Mittags: Schnitzel gefroren in den Ofen (200 °C, 15 Min.), Bratkartoffeln dazu, Rahmsoße frisch.":"Mittags: Bratkartoffeln frisch braten – 12 Min.","Kochen: "+w.pasta[0]+(r===1?" – 4 Portionen essen, 8 einfrieren.":" – 4 Portionen (heute, Do + Fr abends, Sa mittags).")]; }
  if(dow===4){ p.lunch=w.wrap; p.lunchLabel="Mittags · Uni-Box"; p.dinner=w.pasta; p.snack="Langer Uni-Tag? Brötchen mit Aufschnitt oder Skyr einpacken";
    p.tasks=["Uni-Box einpacken. Abends nur aufwärmen – kein Kochen nach einem langen Tag."]; }
  if(dow===5){ p.lunch=w.wrap; p.lunchLabel="Mittags · Uni-Box"; p.dinner=w.pasta; p.snack="Langer Uni-Tag? Reserve-Portion oder Brötchen einpacken";
    p.tasks=["Uni-Box + Snack einpacken. Abends nur aufwärmen."]; }
  if(dow===6){ p.lunch=w.pasta; p.dinner=w.fake; p.fake=true;
    p.tasks=["Fakeaway-Abend: frisch machen.","Einkaufen für morgen – Liste der nächsten Woche ist schon offen."]; if(r===5) p.tasks.push("Reis für morgen (Fried Rice) heute schon kochen und kalt stellen."); }
  p.act = w.act && w.act[dow] ? w.act[dow] : null;
  return p;
}

var listRot = null;
function shopAbs(r){
  var t=today(), s=startDate(), cur = t<s ? 0 : absWeek(t);
  if(t>=s && t.getDay()===6) cur += 1; // samstags: Einkauf für die nächste Woche
  for(var k=0;k<NW;k++){ if(rot(cur+k)===r) return cur+k; }
  return cur;
}
function defaultRot(){ var t=today(), s=startDate(); if(t<s) return 1; return rot(absWeek(t) + (t.getDay()===6?1:0)); }

  var el=document.getElementById("v-technik");
  var html='<div class="head"><h3>'+TECH.length+' Animationen</h3><h1>Technik</h1><p class="sub">Tippe eine Technik an – die Animation klappt direkt auf.</p></div><div class="stack">';
  TECH.forEach(function(t){ html+='<div class="card tacc big" id="t-'+t.id+'"><button class="ttog" data-ttog="'+t.id+'" aria-expanded="false">'+ico(TECH_ICON[t.id]||"pasta")+'<span style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="dish">'+esc(t.name)+'</span><span class="note">'+t.steps.length+' Schritte</span></span><span class="chev" aria-hidden="true"></span></button><div class="tslot"></div></div>'; });
  el.innerHTML=html+'</div>';
}

/* ---------- Navigation ---------- */
var VIEWS=["heute","einkauf","rezepte","technik","vorrat"], lastView=null;
function show(){
  var v=(location.hash||"#heute").slice(1);
  if(v.indexOf("r-")===0 && R[v.slice(2)]){ if(!lastView){ lastView="rezepte"; showView("rezepte"); } openRecipe(v.slice(2)); return; }
  if(v.indexOf("t-")===0){ if(lastView!=="technik") showView("technik"); var c=document.getElementById(v); if(c&&c.scrollIntoView) c.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(VIEWS.indexOf(v)<0) v="heute";
  showView(v);
}
function showView(v){
  lastView=v;
  VIEWS.forEach(function(n){ document.getElementById("v-"+n).classList.toggle("on", n===v); });
  document.querySelectorAll("nav a").forEach(function(a){ if(a.dataset.v===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  ({heute:renderHeute,einkauf:renderEinkauf,rezepte:renderRezepte,technik:renderTechnik,vorrat:renderVorrat})[v]();
  closeRecipe(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", show);

document.addEventListener("click", function(e){
  var t=e.target.closest("button"); if(!t) return;
  if(t.id==="close"){ closeRecipe(); location.hash=lastView||"heute"; return; }
  if(t.dataset.ttog){ toggleTech(t); return; }
  if(t.dataset.tstep){ var a1=t.dataset.tstep.split("|"); setTechStep(a1[0],+a1[1]); return; }
  if(t.dataset.tnext){ setTechStep(t.dataset.tnext,(techState[t.dataset.tnext]||0)+1); return; }
  if(t.dataset.tprev){ setTechStep(t.dataset.tprev,(techState[t.dataset.tprev]||0)-1); return; }
  if(t.dataset.tplay){ var u=t.dataset.tplay; techPaused[u]=!techPaused[u]; t.textContent=techPaused[u]?"▶":"❚❚"; setTechStep(u, techState[u]||0); return; }
  if(t.dataset.tog){ openCards[t.dataset.tog]=!openCards[t.dataset.tog]; renderHeute(); return; }
  if(t.dataset.r){ location.hash="r-"+t.dataset.r; return; }
  if(t.dataset.go){ location.hash=t.dataset.go; return; }
  if(t.dataset.shift!==undefined){ var base=selDay||(today()<startDate()?startDate():today()); var sh=+t.dataset.shift; selDay= sh===0?null:addDays(base,sh); if(selDay&&daysBetween(today(),selDay)===0) selDay=null; renderHeute(); return; }
  if(t.dataset.day){ selDay=parseD(t.dataset.day); if(daysBetween(today(),selDay)===0) selDay=null; renderHeute(); return; }
  if(t.dataset.wk){ listRot=+t.dataset.wk; renderEinkauf(); return; }
  if(t.dataset.chk!==undefined){ var r=listRot||defaultRot(), key="chk:"+shopAbs(r), c=load(key,{}); c[t.dataset.chk]=!c[t.dataset.chk]; save(key,c); renderEinkauf(); return; }
  if(t.dataset.reset){ save(t.dataset.reset,{}); renderEinkauf(); return; }
  if(t.dataset.st){ var k="stock:"+t.dataset.st; save(k, Math.max(0, load(k,0)+(+t.dataset.d))); renderVorrat(); return; }
  if(t.dataset.act){ var sk="stock:"+t.dataset.k; save(sk, Math.max(0, load(sk,0)+(+t.dataset.d))); save(t.dataset.act,true); renderHeute(); return; }
});
document.addEventListener("change", function(e){
  if(e.target.id==="startin" && e.target.value){
    var d=parseD(e.target.value); d=addDays(d,-d.getDay()); save("start", fmtISO(d)); selDay=null; listRot=null; renderVorrat();
  }
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && document.getElementById("sheet").classList.contains("open")){ closeRecipe(); location.hash=lastView||"heute"; } });

show();
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
