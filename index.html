<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essensplan">
<meta name="theme-color" content="#07090D">
<title>Mein Essensplan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Handy-App mit fester Navigation unten; ein Bildschirm pro Bereich (Heute, Einkauf, Rezepte, Vorrat) */
:root{
  /* Ein festes Theme: Schwarz mit Blau */
  --bg:#07090D;
  --surface:#11151D;
  --ink:#EDF2FA;
  --muted:#8995A8;
  --line:#1F2633;
  --accent:#3B82F6;
  --accent-ink:#FFFFFF;
  --hi:#5AB0FF;
  --hi-soft:#0E1E36;
  --accent-soft:#102341;
  --tile:#18202D;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.45);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:800}
h3{font-size:13px;font-weight:600;font-family:var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sub{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.acchead{all:unset;display:flex;flex-direction:column;gap:6px;cursor:pointer;width:100%;box-sizing:border-box}
.acchead:focus-visible{outline:3px solid var(--hi);outline-offset:4px;border-radius:8px}
.acchead .chev{transform:rotate(135deg);transition:transform .2s}
.acchead .chev.up{transform:rotate(-45deg)}
.rbody{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;display:flex;flex-direction:column;gap:4px}
.rbody .steps li{font-size:16px}
.card.tap{width:100%;text-align:left;font:inherit;color:inherit}
.card.tap:active{transform:scale(.99)}
.card.cook{border-color:var(--hi);box-shadow:inset 4px 0 0 var(--hi)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dish{font-size:18px;font-weight:700}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--hi-soft);color:var(--ink);border:1px solid var(--hi);white-space:nowrap}
.pill.green{background:var(--accent-soft);border-color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-align:left}
.tasks{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;gap:8px;font-size:15px}
.tasks li::before{content:"";flex:0 0 8px;height:8px;margin-top:7px;border-radius:2px;background:var(--hi)}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.banner .btn{background:var(--accent-ink);color:var(--accent);align-self:flex-start}
/* Tagesleiste */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-height:52px}
.day b{font-size:15px}
.day.cookday{border-color:var(--hi)}
.day.today b{color:var(--accent)}
.day.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.day.sel b{color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:var(--hi)}
/* Segmente */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:38px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Einkauf */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum .card{gap:2px}
.big{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.section{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;text-align:left;width:100%;min-height:56px}
.box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.item[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.item[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border-left:3px solid var(--accent-ink);border-bottom:3px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.item .txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.item .n{font-weight:600}
.item .q{font-size:13px;color:var(--muted)}
.item .p{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);white-space:nowrap}
.item[aria-pressed="true"]{opacity:.55}
.item[aria-pressed="true"] .n{text-decoration:line-through}
/* Rezepte */
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;width:100%;text-align:left;min-height:60px}
.ritem .n{font-weight:700;font-size:17px}
.ritem .t{font-size:13px;color:var(--muted)}
.chev{width:9px;height:9px;border-right:2.5px solid var(--muted);border-top:2.5px solid var(--muted);transform:rotate(45deg);flex:0 0 auto}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;display:none}
.sheet.open{display:block}
.sheet main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.back{position:sticky;top:0;z-index:2;background:var(--bg);width:100%;display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0;margin-bottom:8px;min-height:44px}
.back::before{content:"";width:9px;height:9px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing li{padding:9px 0;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;font-size:17px;line-height:1.5}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:15px;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tip{background:var(--hi-soft);border:1px solid var(--hi);border-radius:12px;padding:12px 14px;font-weight:600}
/* Vorrat */
.stock{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ctr{display:flex;align-items:center;gap:10px}
.ctr button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.ctr output{font-family:var(--display);font-size:26px;font-weight:800;min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;z-index:10}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;min-height:52px;justify-content:center}
nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:var(--tile);display:grid;place-items:center}
.ico svg{width:30px;height:30px}
.ico.s{width:36px;height:36px;border-radius:11px}.ico.s svg{width:24px;height:24px}
.ico.xs{width:26px;height:26px;border-radius:8px;background:transparent}.ico.xs svg{width:24px;height:24px}
.ico.xl{width:84px;height:84px;border-radius:26px;margin-bottom:12px}.ico.xl svg{width:58px;height:58px}
.mealrow{display:flex;align-items:center;gap:12px}
.sech{display:flex;align-items:center;gap:6px}


.nut{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px;margin:4px 0 10px}
.nut div{background:var(--tile);border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.nut b{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.nut span{font-size:11px;color:var(--muted)}
.nut .price{background:var(--accent-soft);outline:1px solid var(--accent)}
.bockline{display:flex;flex-direction:column;gap:6px;padding:0 16px 12px}
.bockline .link{font-size:13px;align-self:flex-start}
.bockbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.bockbtn span:first-child{display:flex;align-items:center;gap:6px;text-align:left}
.tag.wish{background:var(--accent);color:var(--accent-ink)}
.bockmoods{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.bockmoods .awaybtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bockq{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;margin-bottom:6px}
.bockitem{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;margin-bottom:8px}
.bockitem .p{font-weight:800;white-space:nowrap}
.bockitem.free .p{color:var(--accent)}
.bockex{margin-bottom:8px}
/* Technik */
.tstage svg .ol{stroke:#1b130e;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;paint-order:stroke}
.tstage svg .slice,.tstage svg .chick,.tstage svg .schnbody,.tstage svg .pattybody,.tstage svg .stkbody,.tstage svg .brown{stroke:#1b130e;stroke-width:1.8;paint-order:stroke}
.spark circle{fill:#ffd36b;animation:spark .9s ease-out infinite}
.spark circle:nth-child(2){animation-delay:.3s}.spark circle:nth-child(3){animation-delay:.55s}.spark circle:nth-child(4){animation-delay:.75s}
@keyframes spark{from{transform:translateY(0);opacity:1}to{transform:translateY(-16px);opacity:0}}
@media (prefers-reduced-motion: reduce){.spark circle{animation:none;opacity:0}}

.tprog{height:4px;background:#1b2433}
.tprog i{display:block;height:100%;width:0;background:var(--accent);animation:tp 8s linear forwards}
.tprog i.full{width:100%;animation:none;background:#2a3b57}
@keyframes tp{to{width:100%}}
.tlinks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tacc{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.tacc.big{background:var(--surface);padding:0}
.ttog{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;font-weight:700}
.tacc.big .ttog{padding:14px 16px}
.ttog:focus-visible{outline:3px solid var(--hi);outline-offset:-3px}
.ttog .chev{transform:rotate(135deg);transition:transform .2s}
.ttog[aria-expanded="true"] .chev{transform:rotate(-45deg)}
.tslot .tplayer{padding:0 12px 12px}
.tacc.big .tslot .tplayer{padding:0 16px 16px}

.tstage{border-radius:12px;overflow:hidden;margin:8px 0 4px}
.tstage svg{display:block;width:100%;height:auto}
.tstage [data-show]{transition:opacity .45s}
.tstage .fadein{opacity:0;transition:opacity .35s}
.tstage .on .fadein{opacity:1}
.tcap{margin:8px 0 6px;font-weight:600;min-height:3em;font-size:15px}
.tdots{display:flex;gap:6px}
.tdot{width:12px;height:12px;border-radius:50%;border:0;background:var(--line);padding:0}
.tdot.on{background:var(--accent)}
.lbl{fill:#9fb0c6;font:600 11px var(--body)}
.ttxt{fill:#5ab0ff;font:800 16px var(--display)}
.warn{fill:#f2b53a;font:800 13px var(--display);letter-spacing:.06em}
.chop{animation:chop .55s ease-in-out infinite}
@keyframes chop{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}
.slide{animation:slide 2.4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-28px)}to{transform:translateX(28px)}}
.flame{animation:flick .4s ease-in-out infinite alternate;transform-origin:150px 168px}
@keyframes flick{from{transform:scaleY(.85)}to{transform:scaleY(1.1)}}
.steam path{stroke:#9fb0c6;stroke-width:2;fill:none;opacity:.6;animation:rise 1.8s ease-in infinite}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes rise{from{transform:translateY(8px);opacity:0}40%{opacity:.7}to{transform:translateY(-12px);opacity:0}}
.smoke path{stroke:#c9d2dc}
.bubbles circle{fill:#d6ecff;animation:bub 1.2s ease-in infinite}
.bubbles circle:nth-child(2){animation-delay:.4s}.bubbles circle:nth-child(3){animation-delay:.8s}
@keyframes bub{from{transform:translateY(4px);opacity:1}to{transform:translateY(-10px);opacity:0}}
.sizzle circle{fill:#ffd36b;animation:bub .8s ease-in infinite}
.brown{fill:#f3e1b8;transition:fill 2.5s}
.on .brown{fill:#c98a3a}
.chick{fill:#f2b8a8;transition:fill 2s}
.on .chick{fill:#c9772f}
.slice{fill:#efd59a;stroke:#c99a4a;stroke-width:1.2;transition:fill 2.5s}
[data-s="3"] .slice{fill:#d08f2f}
.schn{transition:transform 1.1s ease-in-out;transform:translate(70px,112px)}
.schnbody{fill:#f2b8a8;transition:fill .8s .6s}
[data-s="1"] .schn{transform:translate(70px,112px)}[data-s="1"] .schnbody{fill:#f7efe4}
[data-s="2"] .schn{transform:translate(160px,112px)}[data-s="2"] .schnbody{fill:#f6dc8a}
[data-s="3"] .schn{transform:translate(250px,112px)}[data-s="3"] .schnbody{fill:#c99a5a}
.patty{transform-origin:150px 122px;transition:transform .5s}
.pattybody{fill:#c96a5a;transition:fill 2s}
[data-s="1"] .patty,[data-s="2"] .patty,[data-s="3"] .patty{transform:scale(2.1,.55)}
[data-s="2"] .pattybody,[data-s="3"] .pattybody{fill:#7a3e25}
.press{transition:transform .5s;transform:translateY(-10px)}
[data-s="1"] .press{transform:translateY(70px)}
[data-s="2"] .press,[data-s="3"] .press{transform:translateY(-60px)}
.cheese{opacity:0;transition:opacity .6s .4s}
[data-s="3"] .cheese{opacity:1}
.stk{transition:transform .8s;transform:translate(150px,112px)}
.stkbody{fill:#c96a5a;transition:fill 1.5s}
[data-s="1"] .stk{transform:translate(150px,112px)}
[data-s="2"] .stk{transform:translate(150px,112px) scaleY(-1)}[data-s="2"] .stkbody{fill:#7a3e25}
[data-s="3"] .stk{transform:translate(150px,114px)}[data-s="3"] .stkbody{fill:#6e3520}
[data-s="1"] .stkbody{fill:#9a4e32}
.spoon{animation:baste 1s ease-in-out infinite alternate;transform-origin:228px 64px}
@keyframes baste{from{transform:rotate(-8deg)}to{transform:rotate(12deg)}}
.water{fill:#dfe9f2;transition:fill 1.5s}
.on .water{fill:#bcd8f0}
.swirl{animation:sw 1.4s ease-in-out infinite alternate;transform-origin:160px 100px}
@keyframes sw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.lid{transition:transform .6s,opacity .6s;opacity:0;transform:translateY(-30px)}
[data-s="2"] .lid,[data-s="3"] .lid{opacity:1;transform:translateY(0)}
.wlevel{transition:height 1s,y 1s}
[data-s="3"] .wlevel{opacity:0}
@media (prefers-reduced-motion: reduce){.chop,.slide,.flame,.steam path,.bubbles circle,.sizzle circle,.spoon,.swirl{animation:none}}
.view{display:none}
.view.on{display:block}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* 2.5D-Overrides */
.tstage svg .cl{opacity:0;transition:opacity .25s, transform .5s}
.tstage svg .cl.cut{opacity:1}
.tstage svg .drop{transform:translate(8px,-6px)}
.tstage svg .drop.cut{transform:translate(0,0)}
.brownbox .f1,.brownbox .f2,.brownbox .f3{transition:fill 3s}
.on .brownbox .f1{fill:#e3a45a}.on .brownbox .f3{fill:#c9852f}.on .brownbox .f2{fill:#a8691f}
.chickbox .f1,.chickbox .f2,.chickbox .f3{transition:fill 3s}
.on .chickbox .f1{fill:#e6a05a}.on .chickbox .f3{fill:#c9772f}.on .chickbox .f2{fill:#a85f22}
.schn{transition:transform 2.2s ease-in-out;transform:translate(70px,118px)}
[data-s="1"] .schn{transform:translate(70px,118px)}[data-s="2"] .schn{transform:translate(160px,118px)}[data-s="3"] .schn{transform:translate(250px,118px)}
.schnbody{fill:#f2b8a8;stroke:#1b130e;stroke-width:2.2;transition:fill 1.5s 1s}
.patty{transform-origin:150px 114px;transition:transform 1.2s cubic-bezier(.3,1.4,.5,1)}
[data-s="1"] .press{transform:translateY(56px)}
.press{transition:transform 1.2s ease-in-out}
.stk{transition:transform 1.6s;transform:translate(150px,104px)}
[data-s="0"] .stk,[data-s="3"] .stk{transform:translate(150px,112px)}[data-s="1"] .stk,[data-s="2"] .stk{transform:translate(150px,104px)}
.lid{transition:transform 1.4s,opacity 1.4s}
.kn{transform:none}

/* Startseite clean */
#v-heute{display:none}
#v-heute.on{display:flex;flex-direction:column;gap:14px}
.hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.hsub{font-size:14px;color:var(--muted);font-weight:600}
.hhead h1{font-size:34px}
.wkpill{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.strip{display:flex;align-items:center;gap:4px}
.strip .days{flex:1;margin:0;gap:4px}
.sarr{border:0;background:transparent;color:var(--muted);font-size:22px;width:24px;height:52px;padding:0}
.day{border:0;background:transparent;min-height:54px;border-radius:12px}

.mi{width:13px;height:13px;vertical-align:-2px}

/* Friedrich Scherz */
.fsbtn{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#2a62e6,#0f2a66);box-shadow:0 10px 24px rgba(0,0,0,.55),0 0 0 3px rgba(90,176,255,.35);z-index:15;cursor:pointer;transition:transform .25s,opacity .25s}

.fsbtn{overflow:visible}.fsbtn svg{overflow:hidden;border-radius:50%}
.fsdot{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#34d399;border:2.5px solid var(--bg)}
.fs-open .fsbtn{transform:scale(.6);opacity:0;pointer-events:none}
.fsav .fseyes{animation:fsblink 4.5s infinite;transform-origin:60px 60px}
@keyframes fsblink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.fsbtn .fshead{animation:fsbob 3s ease-in-out infinite;transform-origin:60px 80px}
@keyframes fsbob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.fssheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.fssheet.open{transform:translateY(0)}
.fsgrab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.fshead2{display:flex;align-items:center;gap:12px;padding:10px 16px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e1830,var(--bg))}
.fsavbig .fsav{width:48px;height:48px;background:radial-gradient(circle at 35% 30%,#2a62e6,#0f2a66);border-radius:50%;box-shadow:0 0 0 2px rgba(90,176,255,.35)}
.fsavbig.pop .fsav{animation:fspop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes fspop{0%{transform:scale(1)}40%{transform:scale(1.15) rotate(-6deg)}100%{transform:scale(1)}}
.fstitle{flex:1;display:flex;flex-direction:column;gap:1px}
.fstitle b{font-family:var(--display);font-size:18px}
#fsstatus{font-size:12px;color:#34d399;font-weight:600}
.fsx{border:0;background:var(--tile);color:var(--ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.fsx svg{width:18px;height:18px}
.fsmsgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
.fsm{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.fsm.first{margin-top:10px}
.fsm.me{align-self:flex-end;flex-direction:row-reverse}
.fsm.new{animation:fsin .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes fsin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.fsmini{flex:0 0 30px;width:30px;height:30px;align-self:flex-end}
.fsmini .fsav{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a62e6,#0f2a66)}
.fsb{position:relative;padding:9px 12px 18px;border-radius:18px;font-size:15px;line-height:1.45;min-width:64px}
.fsm.fs .fsb{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.fsm.me .fsb{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-bottom-right-radius:6px}
.fstime{position:absolute;right:10px;bottom:3px;font-size:10px;opacity:.55}
.fstxt + .fc{margin-top:8px}
.typing{display:flex;gap:4px;padding:14px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:fsdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes fsdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.fc{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:230px}
.fchead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
.fcsn{font-size:11px;color:var(--muted);font-weight:600}

.fct{flex:1;display:flex;flex-direction:column;min-width:0}

.fcrec{display:flex;align-items:center;gap:10px;padding:10px 12px}

.fcstats span{flex:1;background:var(--tile);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.fcstats b{font-family:var(--display);font-size:15px;color:var(--ink)}
.fcbtns{display:flex;gap:6px;padding:8px 10px 10px}
.fcb{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 8px;font:inherit;font-size:13px;font-weight:700}
.fcb.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.fcb:disabled{opacity:.4}
.stbar{height:4px;background:var(--line)}
.stbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.sttext{margin:0;padding:12px;font-size:16px;line-height:1.5}

.tmnum{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--hi)}
.tmbar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tmbar i{display:block;height:100%;width:0;background:var(--hi);transition:width .5s linear}
.fc.timer.over{border-color:#34d399}.fc.timer.over .tmnum{color:#34d399}
.fcchips{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px 4px}
.fcchips span{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--tile);border-radius:999px;padding:3px 9px 3px 4px}
.fschips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.fschips::-webkit-scrollbar{display:none}
.fschip{flex:0 0 auto;border:1px solid rgba(90,176,255,.45);background:rgba(59,130,246,.1);color:#cfe3ff;border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;animation:fsin .3s both}
.fsform{display:flex;gap:8px;padding:6px 12px 10px;align-items:center}
.fsform input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;transition:border-color .2s}
.fsform input:focus{border-color:var(--accent);outline:none}
.fsmic,.fssend{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;flex:0 0 auto}
.fsmic{background:var(--tile);color:var(--ink)}
.fssend{background:var(--accent);color:#fff}
.fsmic svg,.fssend svg{width:20px;height:20px}
.fsmic.on{background:#e2453a;color:#fff;animation:fspulse 1s ease-in-out infinite}
@keyframes fspulse{0%,100%{box-shadow:0 0 0 0 rgba(226,69,58,.6)}50%{box-shadow:0 0 0 10px rgba(226,69,58,0)}}
@media (prefers-reduced-motion: reduce){.fsav .fseyes,.fsbtn .fshead,.fsm.new,.typing i,.fschip,.fsmic.on{animation:none}}

.awayline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 16px 12px;font-size:13px;color:var(--muted)}
.awayline span{flex:1;min-width:120px}

.tag.away{color:#34d399;border-color:#34d399;background:rgba(52,211,153,.12)}
/* Fragebogen */
#ob{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,#123a8a 0%,#0a1428 45%,var(--bg) 80%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.obchip{border:1.5px solid var(--line);background:var(--tile);color:var(--ink);border-radius:999px;padding:10px 15px;font-size:15px;font-weight:600;min-height:44px;transition:transform .12s,background .15s,border-color .15s}

  oats:{name:"Müsli mit Joghurt", time:"1 Min.", por:"1 Portion · ca. 550 kcal",
    ing:["250 g Joghurt oder Skyr","80 g Müsli","Süßungsmittel nach Geschmack"],
    steps:["Joghurt in eine Schüssel, Süßungsmittel unterrühren.","Müsli drüber – fertig.","Für die Uni: Joghurt in eine Box, Müsli separat in ein kleines Glas, erst kurz vorm Essen mischen."],
    tip:"Mit Skyr statt normalem Joghurt hast du fast dreimal so viel Eiweiß (ca. 30 g statt 12 g) und bist länger satt – schmeckt mit Süßungsmittel fast gleich."},
  drumsticks:{name:"Ofen-Drumsticks mit zwei Dips", time:"15 Min. + 45 Min. Ofen", por:"4 Portionen (ca. 5 Stück pro Portion)",
    ing:["2,4 kg Hähnchenunterschenkel (ca. 20 Stück)","3 EL Öl, 2 EL Honig, 2 EL Sojasoße","2 TL Paprikapulver (geräuchert, wenn da), 2 TL Knoblauchpulver, 1 TL Salz, 1 TL Chiliflocken","2 kg Kartoffeln für Wedges","Dip 1 – Honig-Senf: 150 g Skyr, 2 EL Mayo, 2 EL Senf, 2 EL Honig","Dip 2 – Knoblauch-Kräuter: 150 g Skyr, 1 TL Knoblauchpulver, Kräuter, Salz, Spritzer Zitrone"],
    steps:["Ofen auf 210 °C Umluft. Drumsticks trocken tupfen – trocken = knusprig.","Öl, Honig, Sojasoße und Gewürze verrühren, Drumsticks darin wenden.","Mit Abstand auf ein Blech mit Backpapier legen. Kartoffeln in Spalten schneiden, mit Öl, Salz und Paprika aufs zweite Blech.","Beides 40–45 Min. backen, nach 20 Min. wenden. Fertig, wenn die Haut dunkel-knusprig ist.","Dips jeweils verrühren und in kleine Gläser füllen.","In 4 Boxen: Drumsticks und Wedges, Dips getrennt."],
    tip:"Für die letzten 5 Min. den Grill im Ofen anmachen – dann wird die Haut richtig crispy. Kalt in der Uni schmecken sie mit Dip trotzdem gut."},
  sesam:{name:"Honig-Sesam-Chicken mit Sticky-Reis", time:"30 Min.", por:"4 Portionen",
    ing:["1 kg Hähnchenschenkel ohne Knochen (saftiger und billiger als Brust)","2 EL Speisestärke oder Mehl","400 g Rundkornreis","Soße: 6 EL Sojasoße, 4 EL Honig, 1 EL Essig, 1 TL Knoblauchpulver, 100 ml Wasser","2 EL Sesam","1 Gurke","optional: 1 TL Chiliflocken oder Sriracha in die Soße"],
    steps:["Reis 2× waschen, mit 520 ml Wasser aufkochen, Deckel drauf, 15 Min. kleinste Stufe, 10 Min. ruhen.","Hähnchen in Würfel schneiden, in Stärke wenden.","In viel Öl in zwei Runden goldbraun und knusprig braten.","Soße in die Pfanne, aufkochen, bis sie dick glänzt. Hähnchen zurück, schwenken, Sesam drüber.","In 4 Boxen: Reis, Chicken, Gurkenscheiben."],
    tip:"Die Stärke macht die Kruste – so bleibt das Chicken auch kalt in der Uni noch leicht knusprig."},
  teriyaki:{name:"Teriyaki-Chicken-Bowl", time:"35 Min.", por:"4 Portionen",
    ing:["1 kg Hähnchenbrust","400 g Rundkornreis (Milch- oder Sushireis)","8 EL Sojasoße","4 EL Honig","1 TL Knoblauchpulver","1 TL Speisestärke oder Mehl","1 Dose Mais","1 Gurke"],
    steps:["Reis 2× kurz waschen, mit 520 ml Wasser aufkochen, Deckel drauf, 15 Min. auf kleinster Stufe garen, dann 10 Min. ruhen lassen. Wird klebrig wie beim Asiaten.","Hähnchen in Würfel schneiden und in Öl scharf anbraten, bis es Farbe hat.","Soße: Sojasoße, Honig, Knoblauch und Stärke in 100 ml Wasser verrühren. In die Pfanne, 3 Min. einkochen, bis sie glänzt.","In 4 Boxen: Reis, Hähnchen mit Soße, Mais, Gurke."],
    tip:"Schmeckt auch kalt – perfekt für die Uni."},
  burrito:{name:"Burrito mit Hack (Wrap oder Bowl)", time:"30 Min.", por:"4 Portionen",

    steps:["Hack in einer großen Pfanne krümelig und braun anbraten.","Gewürz und Tomatenmark dazu, 1 Min. mitbraten, 100 ml Wasser dazu.","Bohnen und Mais abgießen, unterrühren, 5 Min. köcheln. Abkühlen lassen.","Wrap: Füllung und Käse in die Mitte, Seiten einschlagen, eng rollen, in Alufolie wickeln.","Bowl: Reis kochen, Füllung, Käse und Gurke drauf."],
    tip:"Kalt gerollt hält der Wrap 3 Tage im Kühlschrank."},
  bolognese:{name:"Bolognese auf Vorrat", time:"ca. 1,5 Std. (1 Std. davon köcheln)", por:"12 Portionen: 4 essen, 8 einfrieren",
    ing:["1,5 kg Hackfleisch","4 × 500 g passierte Tomaten","3 EL Tomatenmark","1 Zwiebel, klein gewürfelt","2 TL Knoblauchpulver, 2 TL Oregano","1 TL Zucker, Salz, Pfeffer","500 g Spaghetti für diese Woche"],
    steps:["Hack in zwei Runden im größten Topf scharf anbraten, bis es braun ist.","Zwiebelwürfel dazu und mitbraten, bis sie goldbraun sind. Dann Tomatenmark 2 Min. mitrösten.","Passierte Tomaten, Gewürze, Zucker und 200 ml Wasser dazu. Mindestens 1 Std. leise köcheln, ab und zu umrühren.","Spaghetti kochen und 4 Portionen essen bzw. einpacken.","Den Rest abkühlen lassen, in 8 Boxen füllen und einfrieren."],
    tip:"Eingefroren hält sie 3 Monate. Zum Auftauen am Vortag in den Kühlschrank legen."},
  bratkartoffeln:{name:"Bratkartoffeln mit Speck, Spiegeleiern & Bohnen", time:"12 Min. (+ Kartoffeln vorher kochen und auskühlen lassen)", por:"1 große Portion",
    ing:["ca. 400 g vorgekochte, kalte Kartoffeln","2 EL Butterschmalz","Salz, Pfeffer, Paprikapulver","100 g Speckwürfel","optional: etwas Schnittlauch","1 Dose grüne Bohnen (Brechbohnen)","3 Eier"],
    steps:["Sonntag: 1,5 kg festkochende Kartoffeln mit Schale 20 Min. kochen, bis sie fast gar sind. Komplett auskühlen lassen, ab in den Kühlschrank.","Kalte Kartoffeln in 5 mm dicke Scheiben schneiden.","Butterschmalz in die Pfanne, richtig heiß werden lassen. Scheiben in einer einzigen Lage einlegen.","5 Minuten NICHT anfassen. Dann wenden und weitere 4–5 Min. braten.","Erst jetzt salzen, pfeffern, Paprika drüber. Speck in den letzten 3 Min. dazu.","Grüne Bohnen mit etwas Sud aus der Dose im kleinen Topf 3 Min. erwärmen – nicht braten, dann bleiben sie schön weich. Mit Butter, Salz und Pfeffer abschmecken.","In einer zweiten Pfanne 3 Spiegeleier braten. Alles zusammen auf den Teller."],
    tip:"Die Pfanne nie zu voll machen – sonst dämpfen sie statt zu braten. Lieber zwei Runden."},
  smash:{name:"Smash-Burger mit Ofenpommes", time:"30 Min.", por:"2 Burger",
    ing:["500 g Hackfleisch","4 Scheiben Cheddar","2 Burgerbrötchen","500 g TK-Pommes","Mayo, Ketchup, 1 TL Gurkenwasser","Salz, Pfeffer"],
    steps:["Ofen auf 220 °C Umluft. Pommes in einer Lage aufs Blech, ca. 20 Min., nach 10 Min. wenden.","Hack in 4 Kugeln teilen.","Pfanne ohne Öl sehr heiß werden lassen. Kugel rein und sofort mit einem Topfboden flach drücken. Salzen.","2 Min. braten, bis der Rand braun ist. Wenden, Cheddar drauf, 1 Min.","Brötchen kurz in der Pfanne anrösten. Soße: Mayo, Ketchup, Gurkenwasser.","2 Patties pro Burger."],
    tip:"Nach dem Flachdrücken nicht mehr drücken – die Kruste macht den Geschmack."},
  schnitzel:{name:"Rahmschnitzel aus dem Ofen", time:"45 Min.", por:"8 Stück: 4 essen, 4 einfrieren",
    ing:["1,2 kg Hähnchenbrust","100 g Mehl","3 Eier","200 g Paniermehl","2 TL Paprikapulver, Salz","Öl zum Bestreichen","500 g TK-Pommes","300 g TK-Erbsen & Möhren","Rahmsoße: 1 Becher Sahne, 1 TL Brühe, 1 TL Paprikapulver, 1 TL Mehl, Pfeffer"],
    steps:["Ofen auf 200 °C Umluft. Hähnchenbrust waagerecht halbieren oder flach klopfen, salzen.","Drei Teller: Mehl, verquirlte Eier, Paniermehl mit Paprika.","Fleisch nacheinander durch alle drei ziehen, gut andrücken.","Aufs Backpapier, mit Öl bestreichen. 20 Min. backen, nach 10 Min. wenden. Pommes gleichzeitig auf dem zweiten Blech.","Erbsen & Möhren in wenig Salzwasser 5 Min. kochen, mit einem Stück Butter schwenken.","Rahmsoße: Mehl in 1 TL Butter kurz anschwitzen, Sahne und 100 ml Wasser mit Brühe einrühren, Paprika dazu, 3–4 Min. köcheln bis sie leicht dick ist. Wer hat: ein paar gebratene Champignons rein.","4 Schnitzel abkühlen lassen und einzeln verpackt einfrieren (ohne Soße – die machst du frisch, dauert 5 Min.)."],
    tip:"Aus dem Gefrierfach: gefroren aufs Blech, 200 °C, 15 Min."},
  crispy:{name:"Crispy Chicken (Wrap oder Burger)", time:"40 Min. + 30 Min. Einlegen", por:"Wrap: 4 Portionen · Burger: 2–3",
    ing:["600 g Hähnchenbrust in Streifen","200 ml Milch, 1 TL Salz, 1 TL Paprika","100 g Mehl, 2 Eier, 150 g Paniermehl","1 TL Knoblauchpulver, eine Prise Cayenne","Wraps oder Burgerbrötchen","Salat, Tomate, Mayo"],
    steps:["Streifen 30 Min. in Milch mit Salz und Paprika einlegen.","Ofen auf 220 °C Umluft. Abtropfen lassen, durch Mehl, Ei und Paniermehl mit Knoblauch und Cayenne ziehen.","Aufs Backpapier, mit Öl bestreichen, 18–20 Min. backen, einmal wenden.","Wrap: Salat, Tomate, Mayo, Chicken, eng rollen. Burger: Mayo, Gurke, Chicken."],
    tip:"Für die Uni erst einrollen, wenn das Chicken abgekühlt ist – sonst wird der Wrap labbrig."},
  caesar:{name:"Chicken-Caesar-Wrap", time:"25 Min.", por:"4 Portionen",

    steps:["Hähnchen flach schneiden, würzen, in der heißen Pfanne 4–5 Min. pro Seite braten. Abkühlen lassen, in Streifen schneiden.","Dressing verrühren.","Salat klein schneiden, mit Dressing und Parmesan mischen.","Wrap: Salat, Hähnchen, eng einrollen, in Alufolie wickeln."],
    tip:"Schmeckt kalt am besten – ideal für die Uni. Hält 2–3 Tage, wenn der Salat gut abgetropft ist."},
  broetchen:{name:"Brötchen mit Aufschnitt", time:"12 Min.", por:"3–4 Brötchen",
    ing:["4 Aufbackbrötchen","Aufschnitt (z. B. Putenbrust, Salami, Schinken)","Käsescheiben","Frischkäse oder Butter","optional: Gurke, Tomate, 2 Spiegeleier"],
    steps:["Ofen auf 200 °C, Brötchen 8–10 Min. aufbacken.","Aufschneiden, Frischkäse drauf, Aufschnitt und Käse drauf.","Wer Zeit hat: 2 Spiegeleier dazu – macht richtig satt."],
    tip:"Übrige Brötchen sind dein Backup für die Uni, falls die Box mal leer ist – billiger als jeder Bäcker."},
  geschnetzeltes:{name:"Hähnchen-Rahmgeschnetzeltes mit Sticky-Reis", time:"30 Min.", por:"2 große Portionen + 1 Rest",
    ing:["600 g Hähnchenbrust in Streifen","250 g Champignons in Scheiben","2 Becher Sahne (400 ml)","1 TL Brühe, 1 TL Senf, 1 TL Mehl","2 TL Paprikapulver, Salz, Pfeffer","1 kleine Zwiebel, klein gewürfelt","300 g Rundkornreis"],
    steps:["Reis 2× waschen, mit 390 ml Wasser aufkochen, Deckel drauf, 15 Min. kleinste Stufe, 10 Min. ruhen.","Hähnchen mit Mehl bestäuben, in Öl scharf und in zwei Runden anbraten, rausnehmen.","Champignons und Zwiebelwürfel in derselben Pfanne 4 Min. braun anbraten, dann Sahne, 100 ml Wasser, Brühe, Senf und Paprika rein, 3 Min. köcheln.","Hähnchen zurück in die Soße, 2 Min. ziehen lassen, abschmecken."],

  steak:{name:"Monats-Steak mit Pfeffer-Rahmsoße", time:"25 Min.", por:"1 große Portion",
    ing:["1 Rumpsteak oder Hüftsteak, ca. 350 g, mind. 3 cm dick","1 EL Öl, 1 EL Butter, 1 Knoblauchzehe (oder Knoblauchpulver)","Salz, grober Pfeffer","Soße: 1 Becher Sahne, 1 TL grober Pfeffer, ½ TL Brühe, 1 TL Senf","500 g TK-Pommes","Speckbohnen: 300 g TK-Bohnen, 50 g Speckwürfel"],
    steps:["Steak 30 Min. vorher aus dem Kühlschrank nehmen. Pommes in den Ofen (220 °C, 20 Min.).","Steak mit Küchenpapier trocken tupfen, salzen.","Schwere Pfanne mit Öl richtig heiß werden lassen, bis es leicht raucht. Steak rein, 2,5 Min. NICHT bewegen, wenden, 2,5 Min. (bei 3 cm = medium).","Butter und Knoblauch dazu, Steak 1 Min. mit der schäumenden Butter übergießen.","Steak auf ein Brett, 5 Min. ruhen lassen – sonst läuft der Saft raus.","Soße in derselben Pfanne: Sahne, Pfeffer, Brühe, Senf rein, Bratensatz loskratzen, 3 Min. einköcheln.","Bohnen 6 Min. in Salzwasser kochen, abgießen, mit knusprig gebratenem Speck schwenken.","Steak gegen die Faser in Streifen schneiden, pfeffern, mit Soße, Pommes und Speckbohnen."],
    tip:"Hüftsteak ist deutlich günstiger als Rumpsteak und wird genauso gut, wenn du es nicht über medium brätst. Im Angebot kaufen und einfrieren lohnt sich."},
  butterchicken:{name:"Butter Chicken mit Sticky-Reis", time:"40 Min.", por:"4 Portionen",
    ing:["800 g Hähnchenschenkel ohne Knochen","150 g Joghurt oder Skyr","2 EL Currypulver oder Garam Masala, 1 TL Paprikapulver, ½–1 TL Chiliflocken","2 TL Knoblauchpulver, 1 TL Ingwerpulver, Salz","2 EL Butter, 2 EL Tomatenmark, 500 g passierte Tomaten","1 Becher Sahne, 1 TL Zucker","400 g Rundkornreis"],
    steps:["Hähnchen würfeln, mit Joghurt, der Hälfte der Gewürze und Salz mischen, 20 Min. ziehen lassen.","Reis 2× waschen, mit 520 ml Wasser aufkochen, Deckel drauf, 15 Min. kleinste Stufe, 10 Min. ruhen.","Hähnchen in einer heißen Pfanne in zwei Runden kräftig anbraten, rausnehmen.","Butter in die Pfanne, Tomatenmark und restliche Gewürze 1 Min. anrösten. Passierte Tomaten dazu, 10 Min. köcheln.","Sahne und Zucker rein, Hähnchen zurück, 5 Min. ziehen lassen, mit Salz abschmecken."],
    tip:"Je länger die Soße köchelt, desto runder schmeckt sie. Mit Chili kannst du so scharf gehen, wie du willst."},
  frikadellen:{name:"Frikadellen mit Kartoffelpüree & Rahmsoße", time:"50 Min.", por:"10 Frikadellen: 3 heute, Rest kalt für die Uni",
    ing:["1 kg Hackfleisch","2 Eier, 1 altes Brötchen (in Wasser eingeweicht, ausgedrückt) oder 5 EL Paniermehl","1 EL Senf, 1 kleine Zwiebel klein gewürfelt, Salz, Pfeffer, Paprikapulver","Püree: 1,5 kg mehligkochende Kartoffeln, 250 ml Milch, 2 EL Butter, Muskat, Salz","Rahmsoße: 1 Becher Sahne, 1 TL Brühe, 1 TL Mehl, Pfeffer","300 g TK-Erbsen & Möhren"],
    steps:["Zwiebelwürfel in etwas Öl goldbraun anbraten und kurz abkühlen lassen.","Hack, Eier, Brötchen, Senf, Zwiebel und Gewürze kräftig verkneten. 10 flache Frikadellen formen.","In Öl bei mittlerer Hitze pro Seite 5–6 Min. braten, bis sie innen durch sind.","Kartoffeln schälen, 20 Min. in Salzwasser kochen, abgießen, mit warmer Milch, Butter, Muskat und Salz stampfen.","Rahmsoße: Mehl ins Bratfett, kurz anschwitzen, Sahne, 100 ml Wasser und Brühe rein, 3 Min. köcheln.","Erbsen & Möhren 5 Min. kochen, mit Butter schwenken."],
    tip:"Kalte Frikadellen mit Senf sind perfekt für die Uni-Box."},
  gebratenenudeln:{name:"Gebratene Nudeln mit Hähnchen & Ei", time:"30 Min.", por:"4 Portionen",
    ing:["500 g Mie-Nudeln oder Spaghetti","600 g Hähnchenschenkel ohne Knochen","4 Eier","300 g TK-Erbsen & Möhren","6 EL Sojasoße, 1 EL Honig, 1 TL Knoblauchpulver","Chiliflocken oder Sriracha nach Geschmack"],
    steps:["Nudeln kochen, abgießen, mit etwas Öl mischen.","Hähnchen in dünne Streifen, in sehr heißer Pfanne scharf anbraten, rausnehmen.","Erbsen & Möhren 3 Min. braten, an den Rand schieben, Eier in die Mitte schlagen und verrühren.","Nudeln, Hähnchen, Sojasoße, Honig, Knoblauch und Chili dazu, 3 Min. auf voller Hitze schwenken."],
    tip:"Schmeckt kalt sehr gut – deshalb perfekt für die Uni."},
  friedrice:{name:"Egg Fried Rice mit Hähnchen", time:"30 Min. (Reis am Vortag kochen)", por:"4 Portionen",
    ing:["400 g Reis, am besten am Vortag gekocht und kalt","600 g Hähnchenschenkel ohne Knochen","5 Eier","300 g TK-Erbsen & Möhren","6 EL Sojasoße, 1 TL Knoblauchpulver, 1 TL Zucker","Chiliflocken nach Geschmack"],
    steps:["Reis am Samstag kochen und kalt stellen – frischer Reis wird matschig.","Hähnchen klein würfeln, scharf anbraten, rausnehmen.","Erbsen & Möhren 3 Min. braten. Eier dazu, verrühren, stocken lassen.","Kalten Reis rein, mit dem Pfannenwender zerdrücken, 5 Min. auf voller Hitze braten, bis er leicht knuspert.","Hähnchen, Sojasoße, Knoblauch, Zucker, Chili dazu, durchschwenken."],
    tip:"Klebriger Reis klumpt beim Braten – kalt vom Vortag und mit Druck zerdrücken, dann klappt es."},
  spaetzle:{name:"Käsespätzle mit Speck", time:"30 Min.", por:"4 Portionen",
    ing:["1 kg Spätzle (Kühlregal)","300 g geriebener Bergkäse oder Emmentaler","200 g Speckwürfel","100 ml Sahne","Pfeffer, Muskat","optional: Röstzwiebeln aus der Packung (knusprig, nicht fettig)"],
    steps:["Ofen auf 200 °C. Speck knusprig braten.","Spätzle kurz in der Speckpfanne anbraten.","In eine Auflaufform schichten: Spätzle, Käse, Speck – wiederholen. Sahne drüber, pfeffern.","15 Min. backen, bis der Käse blubbert und oben leicht braun ist."],
    tip:"Nach Belieben am Ende knusprige Röstzwiebeln drüber – ganz anders als frische Zwiebeln."},
  gnocchi:{name:"Knusprige Gnocchi in Spinat-Rahm mit Speck", time:"25 Min.", por:"2 große Portionen + Rest",

  pfannkuchen:{name:"Pfannkuchen", time:"20 Min.", por:"6–8 Stück",

    tip:"Hat nur ca. 15 g Eiweiß – deshalb am Wochenende. Unter der Woche hält Müsli mit Skyr länger satt."},

var R2={"haehnchencurry":{"name":"Hähnchen-Kokos-Curry mit Reis","time":"35 Min.","por":"4 Portionen","ing":["800 g Hähnchenbrust","2 Dosen Kokosmilch","300 g TK-Erbsen & Möhren","1 Zwiebel, fein gewürfelt","2 EL Tomatenmark","400 g Reis","2 EL Öl","2 EL Currypulver, 1 TL Kurkuma, Salz, etwas Zucker"],"steps":["Reis kochen.","Hähnchen würfeln und in Öl scharf anbraten, rausnehmen.","Zwiebel glasig braten, Tomatenmark und Curry 1 Min. mitrösten.","Kokosmilch und Gemüse dazu, 8 Min. köcheln, Hähnchen zurück, abschmecken."],"tip":"Schmeckt am zweiten Tag noch besser – ideal zum Vorkochen."},"chili":{"name":"Chili con Carne mit Reis","time":"40 Min.","por":"4 Portionen","ing":["800 g Hackfleisch","2 Dosen Kidneybohnen","1 Dose Mais","1 l passierte Tomaten","1 Zwiebel, fein gewürfelt","2 EL Tomatenmark","400 g Reis","1 EL Öl","Chiliflocken, Kreuzkümmel, Paprikapulver, Salz, 1 TL Zucker"],"steps":["Hack krümelig und kräftig anbraten, Zwiebel dazu.","Tomatenmark und Gewürze 1 Min. mitrösten.","Tomaten, abgespülte Bohnen und Mais dazu, 20 Min. köcheln.","Mit Reis servieren."],"tip":"Wer es milder mag, nimmt die Chiliflocken erst am Teller."},"chilisin":{"name":"Chili sin Carne mit Reis","time":"35 Min.","por":"4 Portionen","ing":["3 Dosen Kidneybohnen","150 g rote Linsen","1 Dose Mais","1 l passierte Tomaten","1 Zwiebel, fein gewürfelt","2 EL Tomatenmark","400 g Reis","2 EL Öl","Chiliflocken, Kreuzkümmel, Paprikapulver, Salz, 1 TL Zucker"],"steps":["Zwiebel in Öl anbraten, Tomatenmark und Gewürze mitrösten.","Tomaten, Linsen und 300 ml Wasser dazu, 15 Min. köcheln.","Bohnen und Mais dazu, 5 Min. weiter köcheln.","Mit Reis servieren."],"tip":"Die Linsen machen es sämig und sättigend wie mit Hack – für ca. 1,50 € pro Portion."},"tofuteri":{"name":"Knusper-Tofu-Teriyaki-Bowl","time":"35 Min.","por":"4 Portionen","ing":["800 g Tofu natur","4 EL Speisestärke","8 EL Sojasoße","4 EL Honig","400 g Reis","1 Gurke","1 Dose Mais","4 EL Öl","1 TL Knoblauch, etwas Ingwer"],"steps":["Reis kochen.","Tofu gut ausdrücken, würfeln, in Stärke wenden und in Öl rundum knusprig braten.","Sojasoße, Honig, Knoblauch und 4 EL Wasser dazu, einkochen lassen, bis es glänzt.","Mit Reis, Gurke und Mais in Boxen verteilen."],"tip":"Tofu vorher 10 Min. zwischen Küchenpapier pressen – dann wird er richtig knusprig."},"lachsbowl":{"name":"Teriyaki-Lachs-Bowl","time":"30 Min.","por":"4 Portionen","ing":["500 g Lachsfilet (TK, aufgetaut)","400 g Reis","6 EL Sojasoße","3 EL Honig","1 Gurke","1 Dose Mais","1 EL Sesam","1 EL Öl","1 TL Knoblauch"],"steps":["Reis kochen.","Lachs in Stücke schneiden und in Öl 2–3 Min. pro Seite braten.","Sojasoße, Honig, Knoblauch dazu, kurz einkochen.","Mit Reis, Gurke, Mais und Sesam anrichten."],"tip":"Schmeckt auch kalt – Lachs nach dem Kochen schnell abkühlen und in den Kühlschrank."},"dal":{"name":"Rote-Linsen-Dal mit Reis","time":"30 Min.","por":"4 Portionen","ing":["400 g rote Linsen","1 Dose Kokosmilch","500 g passierte Tomaten","300 g TK-Blattspinat (ohne Rahm)","1 Zwiebel, fein gewürfelt","400 g Reis","2 EL Öl","2 TL Currypulver, 1 TL Kreuzkümmel, 1 TL Kurkuma, Salz"],"steps":["Reis kochen.","Zwiebel in Öl anbraten, Gewürze 1 Min. mitrösten.","Linsen, Tomaten, Kokosmilch und 400 ml Wasser dazu, 15 Min. köcheln.","Spinat unterrühren, salzen, mit Reis servieren."],"tip":"Eins der günstigsten sättigenden Gerichte überhaupt – unter 1,50 € pro Portion."},"tavuksote":{"name":"Tavuk Sote mit Bulgur-Pilav","time":"35 Min.","por":"4 Portionen","ing":["800 g Hähnchenbrust","2 Paprika (oder Spitzpaprika)","500 g Tomaten","1 Zwiebel, fein gewürfelt","1 EL Paprikamark oder Tomatenmark","300 g Bulgur","20 g Butter","2 EL Öl","Pul Biber, Thymian, Salz, Pfeffer"],"steps":["Bulgur in Butter kurz anrösten, mit 600 ml Wasser und Salz 15 Min. quellen lassen.","Hähnchen würfeln und scharf anbraten.","Zwiebel und Paprika dazu, 4 Min. braten, Mark mitrösten.","Gewürfelte Tomaten dazu, 10 Min. schmoren, mit Bulgur servieren."],"tip":"Mit einem Klecks Joghurt obendrauf wie bei Oma."},"kurufasulye":{"name":"Kuru Fasulye (Bohneneintopf) mit Reis","time":"30 Min.","por":"4 Portionen","ing":["3 Dosen weiße Bohnen","500 g passierte Tomaten","3 EL Tomatenmark","1 Zwiebel, fein gewürfelt","400 g Reis","20 g Butter","3 EL Öl","Pul Biber, Paprikapulver, Salz, Pfeffer"],"steps":["Reis mit Butter kochen.","Zwiebel in Öl anbraten, Tomatenmark und Gewürze 2 Min. rösten.","Abgespülte Bohnen, Tomaten und 300 ml Wasser dazu, 20 Min. köcheln.","Mit Reis servieren."],"tip":"Wer Fleisch will: 300 g Rinderhack mit der Zwiebel anbraten."},"gyrosbowl":{"name":"Hähnchen-Gyros-Bowl mit Tzatziki","time":"35 Min.","por":"4 Portionen","ing":["900 g Hähnchenschenkel ohne Knochen","400 g Reis","500 g Joghurt (griechisch)","1 Gurke","250 g Tomaten","3 EL Öl","Gyrosgewürz, Knoblauch, Salz"],"steps":["Hähnchen in Streifen schneiden, mit Öl und Gyrosgewürz mischen.","In der Pfanne oder bei 220 °C im Ofen 15 Min. knusprig braten.","Reis kochen. Tzatziki: halbe Gurke reiben, ausdrücken, mit Joghurt, Knoblauch, Salz mischen.","Mit Reis, Tomaten und Gurke anrichten."],"tip":"Tzatziki separat in ein kleines Glas – dann bleibt alles frisch."},"erdnusshaehnchen":{"name":"Erdnuss-Hähnchen mit Reis","time":"30 Min.","por":"4 Portionen","ing":["800 g Hähnchenbrust","4 EL Erdnussbutter","1 Dose Kokosmilch","4 EL Sojasoße","2 EL Honig","300 g TK-grüne Bohnen","400 g Reis","1 EL Öl","1 TL Currypulver, Knoblauch, Chiliflocken nach Wunsch"],"steps":["Reis kochen.","Hähnchen würfeln und anbraten, Bohnen dazu, 3 Min. braten.","Kokosmilch, Erdnussbutter, Sojasoße, Honig und Gewürze einrühren.","5 Min. köcheln, bis die Soße sämig ist."],"tip":"Mit Limette oder Zitrone abschmecken – macht es frischer."},"hackreis":{"name":"Asia-Hack-Reispfanne","time":"25 Min.","por":"4 Portionen","ing":["600 g Hackfleisch","400 g Reis","300 g TK-Erbsen & Möhren","6 EL Sojasoße","1 EL Honig","2 EL Öl","Knoblauch, Ingwer, Chiliflocken"],"steps":["Reis kochen (am besten vom Vortag).","Hack in Öl krümelig und knusprig braten.","Gemüse dazu, 3 Min. braten.","Reis, Sojasoße, Honig und Gewürze unterrühren, 3 Min. weiter braten."],"tip":"Kalter Reis vom Vortag brät am besten."},"ofengemuese":{"name":"Ofengemüse mit Feta & Kichererbsen","time":"45 Min.","por":"4 Portionen","ing":["1 kg Kartoffeln","1 Zucchini","2 Paprika","2 Dosen Kichererbsen","2 Packungen Feta","5 EL Öl","Oregano, Paprikapulver, Knoblauch, Salz, Pfeffer"],"steps":["Ofen auf 220 °C. Kartoffeln in Spalten, Gemüse in Stücke schneiden.","Mit abgespülten Kichererbsen, Öl und Gewürzen auf einem Blech mischen.","35 Min. backen, nach 20 Min. wenden.","Feta zerbröseln und die letzten 5 Min. mitbacken."],"tip":"Schmeckt warm und kalt – gut für die Box."},"haehnchengemuese":{"name":"Hähnchen-Gemüse-Pfanne mit Reis","time":"30 Min.","por":"4 Portionen","ing":["800 g Hähnchenbrust","450 g TK-Brokkoli","3 Möhren","1 Zucchini","4 EL Sojasoße","1 EL Honig","1 TL Speisestärke","400 g Reis","2 EL Öl","Knoblauch, Ingwer, Pfeffer"],"steps":["Reis kochen.","Hähnchen würfeln und scharf anbraten, rausnehmen.","Gemüse 5 Min. bissfest braten.","Hähnchen zurück, Sojasoße mit Honig, Stärke und 100 ml Wasser verrühren, dazugeben, aufkochen."],"tip":"Leicht und eiweißreich – rund 550 kcal pro Portion."},"falafelwrap":{"name":"Falafel-Wrap mit Joghurtsoße","time":"35 Min.","por":"4 Portionen","ing":["2 Packungen Falafel-Mischung","6 Wraps","1 Salatkopf","250 g Tomaten","1 Gurke","500 g Joghurt","6 EL Öl","Knoblauch, Salz, Zitronensaft"],"steps":["Falafel-Mischung nach Packung mit Wasser anrühren, 15 Min. quellen lassen.","Kleine Bällchen formen, in Öl rundum braten oder bei 200 °C 20 Min. backen.","Joghurt mit Knoblauch, Salz und Zitrone verrühren.","Wraps mit Salat, Gemüse, Falafel und Soße füllen und fest einrollen."],"tip":"Soße erst morgens drauf – dann wird der Wrap nicht matschig."},"halloumiwrap":{"name":"Halloumi-Wrap mit Gurke & Tomate","time":"25 Min.","por":"4 Portionen","ing":["2 Packungen Halloumi","6 Wraps","1 Salatkopf","250 g Tomaten","1 Gurke","250 g Joghurt","Minze oder Oregano, Salz, Pfeffer"],"steps":["Halloumi in Scheiben schneiden und ohne Öl goldbraun braten.","Joghurt mit Kräutern, Salz und Pfeffer verrühren.","Gemüse schneiden.","Wraps füllen und fest einrollen."],"tip":"Halloumi bleibt auch kalt bissfest – perfekt zum Mitnehmen."},"thunfischwrap":{"name":"Thunfisch-Mais-Wrap","time":"15 Min.","por":"4 Portionen","ing":["3 Dosen Thunfisch","1 Dose Mais","4 EL Mayo","150 g Joghurt","1 Salatkopf","6 Wraps","Salz, Pfeffer, Zitronensaft"],"steps":["Thunfisch abtropfen lassen.","Mit Mais, Mayo, Joghurt, Salz, Pfeffer und Zitrone mischen.","Salat waschen und schneiden.","Wraps füllen und fest einrollen."],"tip":"Ohne Kochen in 15 Minuten – der schnellste Wrap im Plan."},"reissalat":{"name":"Reissalat mit Hähnchen, Mais & Erbsen","time":"30 Min.","por":"4 Portionen","ing":["600 g Hähnchenbrust","300 g Reis","1 Dose Mais","300 g TK-Erbsen & Möhren","1 Gurke","200 g Joghurt","3 EL Mayo","1 EL Öl","Currypulver, Salz, Pfeffer"],"steps":["Reis kochen, Erbsen die letzten 3 Min. mitkochen, abkühlen lassen.","Hähnchen würfeln, braten, abkühlen lassen.","Joghurt, Mayo und Curry verrühren.","Alles mit Mais und Gurke mischen, abschmecken."],"tip":"Hält 3 Tage im Kühlschrank und schmeckt kalt am besten."},"linsensalat":{"name":"Linsensalat mit Feta & Gurke","time":"25 Min.","por":"4 Portionen","ing":["400 g rote Linsen","1 Packung Feta","1 Gurke","250 g Tomaten","1 Zitrone","4 EL Olivenöl","Salz, Pfeffer, 1 TL Zucker, getrocknete Kräuter"],"steps":["Linsen in Wasser 8 Min. bissfest kochen, abgießen, kalt abspülen.","Gurke und Tomaten würfeln.","Dressing aus Zitrone, Öl, Salz, Pfeffer und Zucker.","Alles mischen, Feta drüberbröseln."],"tip":"Rote Linsen nicht zu lange kochen – sonst werden sie Brei."},"tortilla":{"name":"Spanische Kartoffel-Tortilla","time":"40 Min.","por":"4 Portionen","ing":["1 kg Kartoffeln","10 Eier","1 Zwiebel, fein gewürfelt","6 EL Öl","Salz, Pfeffer"],"steps":["Kartoffeln in dünne Scheiben schneiden und mit der Zwiebel in Öl 15 Min. weich braten.","Eier mit Salz verquirlen, Kartoffeln untermischen.","Zurück in die Pfanne, bei kleiner Hitze 10 Min. stocken lassen.","Mit einem Teller wenden, weitere 5 Min. braten, in Stücke schneiden."],"tip":"Kalt in Stücken ein echter Box-Klassiker."},"nudelsalat":{"name":"Italienischer Nudelsalat mit Mozzarella","time":"25 Min.","por":"4 Portionen","ing":["500 g Nudeln (Fusilli/Penne)","2 Kugeln Mozzarella","500 g Tomaten","1 Gurke","5 EL Olivenöl","2 EL Essig, Basilikum oder Oregano, Salz, Pfeffer"],"steps":["Nudeln kochen, kalt abspülen.","Tomaten, Gurke und Mozzarella würfeln.","Dressing aus Öl, Essig, Kräutern, Salz und Pfeffer.","Alles mischen, ziehen lassen."],"tip":"Vor dem Essen einmal durchmischen und nachsalzen."},"quesadilla":{"name":"Hähnchen-Käse-Quesadillas","time":"25 Min.","por":"4 Portionen","ing":["600 g Hähnchenbrust","9 Wraps","300 g Reibekäse","1 Dose Mais","1 Dose Kidneybohnen","1 EL Öl","Taco- oder Paprikagewürz, Salz"],"steps":["Hähnchen klein würfeln, mit Gewürz braten.","Mit Mais und Bohnen mischen.","Je einen Wrap mit Käse und Füllung belegen, einmal zuklappen.","Ohne Öl von beiden Seiten knusprig braten, in Ecken schneiden."],"tip":"Kalt in der Box gut, warm aus der Pfanne noch besser."},"couscous":{"name":"Couscous-Salat mit Hähnchen","time":"25 Min.","por":"4 Portionen","ing":["600 g Hähnchenbrust","300 g Couscous","1 Gurke","250 g Tomaten","1 Paprika","1 Zitrone","4 EL Olivenöl","Kreuzkümmel, Paprikapulver, Minze, Salz"],"steps":["Couscous mit 300 ml kochendem Salzwasser übergießen, 5 Min. quellen lassen.","Hähnchen würfeln, mit Gewürzen braten.","Gemüse würfeln.","Alles mit Zitrone und Öl mischen."],"tip":"Mit Zitrone nachschärfen, wenn er im Kühlschrank durchgezogen ist."},"koefte":{"name":"Köfte mit Bulgursalat","time":"40 Min.","por":"4 Portionen","ing":["800 g Hackfleisch (Rind)","1 Ei","1 kleine Zwiebel, sehr fein gerieben","300 g Bulgur","250 g Tomaten","1 Gurke","2 EL Tomatenmark","250 g Joghurt","4 EL Öl","Kreuzkümmel, Pul Biber, Petersilie, Salz, Pfeffer"],"steps":["Hack mit Ei, Zwiebel und Gewürzen kräftig verkneten, Röllchen formen.","In Öl rundum 8 Min. braten oder bei 220 °C 15 Min. backen.","Bulgur mit 300 ml kochendem Wasser und Tomatenmark 15 Min. quellen lassen.","Gemüse würfeln, mit Bulgur, Öl und Salz mischen; Joghurt dazu."],"tip":"Köfte schmecken kalt mit Joghurt fast besser als warm."},"kartoffelsalat":{"name":"Kartoffelsalat mit Ei & Gurke","time":"35 Min.","por":"4 Portionen","ing":["1,5 kg Kartoffeln","4 Eier","1 Gurke","200 g Joghurt","4 EL Mayo","1 TL Senf","Salz, Pfeffer, Schnittlauch"],"steps":["Kartoffeln mit Schale kochen, pellen und in Scheiben schneiden.","Eier hart kochen und würfeln.","Joghurt, Mayo, Senf, Salz und Pfeffer verrühren.","Alles mit gewürfelter Gurke mischen, 1 Std. ziehen lassen."],"tip":"Mit Joghurt statt nur Mayo leichter und hält länger frisch."},"tomatensahne":{"name":"Tomaten-Sahne-Pasta mit Mozzarella","time":"25 Min.","por":"4 Portionen","ing":["500 g Nudeln","1 l passierte Tomaten","1 Becher Sahne","2 Kugeln Mozzarella","1 kleine Zwiebel, fein gewürfelt","2 EL Tomatenmark","2 EL Öl","Oregano, Basilikum, Salz, Pfeffer, 1 TL Zucker"],"steps":["Nudeln kochen.","Zwiebel anbraten, Tomatenmark mitrösten.","Tomaten, Sahne und Gewürze dazu, 10 Min. köcheln.","Nudeln untermischen, Mozzarella in Stücken drauf, schmelzen lassen."],"tip":"Ein Löffel Nudelwasser in der Soße macht sie extra cremig."},"lachspasta":{"name":"Lachs-Sahne-Pasta mit Spinat","time":"25 Min.","por":"4 Portionen","ing":["500 g Lachsfilet (TK, aufgetaut)","500 g Nudeln","2 Becher Sahne","300 g TK-Blattspinat (ohne Rahm)","1 Zitrone","50 g Parmesan","Knoblauch, Salz, Pfeffer, Muskat"],"steps":["Nudeln kochen.","Spinat mit Sahne und Knoblauch aufkochen.","Lachs in Würfeln in die Soße, 4 Min. gar ziehen lassen.","Mit Zitrone, Salz, Pfeffer abschmecken, Nudeln und Parmesan unterheben."],"tip":"Lachs nur ziehen lassen, nicht kochen – dann bleibt er saftig."},"thunfischpasta":{"name":"Thunfisch-Tomaten-Pasta","time":"20 Min.","por":"4 Portionen","ing":["3 Dosen Thunfisch","1 l passierte Tomaten","500 g Nudeln","1 kleine Zwiebel, fein gewürfelt","2 EL Tomatenmark","2 EL Öl","Oregano, Chiliflocken, Salz, Pfeffer, 1 TL Zucker"],"steps":["Nudeln kochen.","Zwiebel in Öl anbraten, Tomatenmark mitrösten.","Tomaten und Gewürze dazu, 10 Min. köcheln.","Thunfisch zerpflücken, unterrühren, mit den Nudeln mischen."],"tip":"Unter 2 € pro Portion und viel Eiweiß."},"macncheese":{"name":"Mac & Cheese aus dem Ofen","time":"35 Min.","por":"4 Portionen","ing":["500 g kurze Nudeln","500 ml Milch","50 g Butter","40 g Mehl","300 g Reibekäse","1 Packung Cheddarscheiben","Senfpulver oder 1 TL Senf, Paprikapulver, Salz, Pfeffer"],"steps":["Nudeln 2 Min. kürzer als auf der Packung kochen.","Butter schmelzen, Mehl einrühren, nach und nach Milch dazu, aufkochen.","Käse (bis auf eine Handvoll) und Gewürze in der Soße schmelzen.","Mit Nudeln mischen, in eine Form, restlichen Käse drauf, 15 Min. bei 200 °C überbacken."],"tip":"Beim Aufwärmen einen Schuss Milch dazu."},"gulasch":{"name":"Rindergulasch mit Kartoffeln","time":"2 Std. (meist Schmoren)","por":"4 Portionen","ing":["1 kg Rindergulasch","3 Zwiebeln, fein gewürfelt (zerkochen komplett)","3 EL Tomatenmark","1,5 kg Kartoffeln","3 EL Öl","2 EL Paprikapulver edelsüß, Kümmel, Majoran, Salz, Pfeffer"],"steps":["Fleisch in Portionen kräftig anbraten.","Zwiebeln dazu, 10 Min. braten, Tomatenmark und Paprikapulver kurz mitrösten.","Mit 800 ml Wasser ablöschen, zugedeckt 1,5 Std. schmoren.","Kartoffeln kochen und dazu servieren."],"tip":"Die Zwiebeln lösen sich beim Schmoren komplett auf und machen die Soße dick."},"hackbaellchen":{"name":"Hackbällchen in Tomatensoße mit Nudeln","time":"35 Min.","por":"4 Portionen","ing":["800 g Hackfleisch","1 Ei","4 EL Paniermehl","1 l passierte Tomaten","500 g Spaghetti","2 EL Öl","Oregano, Knoblauch, Salz, Pfeffer, 1 TL Zucker"],"steps":["Hack mit Ei, Paniermehl, Salz und Pfeffer verkneten, 20 Bällchen formen.","Bällchen in Öl rundum braun braten.","Tomaten und Gewürze dazu, 15 Min. zugedeckt köcheln.","Nudeln kochen und mit Bällchen und Soße servieren."],"tip":"Bällchen und Soße getrennt von den Nudeln einfrieren – hält 3 Monate."},"kichererbsencurry":{"name":"Kichererbsen-Spinat-Curry mit Reis","time":"30 Min.","por":"4 Portionen","ing":["2 Dosen Kichererbsen","1 Dose Kokosmilch","500 g passierte Tomaten","450 g TK-Blattspinat (ohne Rahm)","1 Zwiebel, fein gewürfelt","400 g Reis","2 EL Öl","2 TL Currypulver, 1 TL Garam Masala, Salz"],"steps":["Reis kochen.","Zwiebel anbraten, Gewürze kurz mitrösten.","Tomaten, Kokosmilch, Kichererbsen und Spinat dazu, 15 Min. köcheln.","Abschmecken, mit Reis servieren."],"tip":"Mit einem Klecks Joghurt wird es milder."},"kartoffelauflauf":{"name":"Kartoffel-Hack-Auflauf","time":"60 Min.","por":"4 Portionen","ing":["1,5 kg Kartoffeln","600 g Hackfleisch","2 Becher Sahne","200 g Reibekäse","1 kleine Zwiebel, fein gewürfelt","300 g TK-Erbsen & Möhren","1 EL Öl","Salz, Pfeffer, Muskat, Paprikapulver"],"steps":["Ofen auf 200 °C. Kartoffeln in dünne Scheiben schneiden.","Hack mit Zwiebel braten, würzen, Gemüse untermischen.","Kartoffeln und Hack in einer Form schichten, Sahne mit Salz und Muskat drübergießen.","Käse drauf, 45 Min. backen, bis die Kartoffeln weich sind."],"tip":"Mit Alufolie abdecken, wenn der Käse zu früh braun wird."},"risotto":{"name":"Champignon-Hähnchen-Risotto","time":"40 Min.","por":"4 Portionen","ing":["600 g Hähnchenbrust","400 g Rundkornreis (Risottoreis)","500 g Champignons","80 g Parmesan","30 g Butter","1 kleine Zwiebel, fein gewürfelt","2 EL Öl","1,2 l Gemüsebrühe, Salz, Pfeffer"],"steps":["Hähnchen und Pilze anbraten, rausnehmen.","Zwiebel in Öl glasig dünsten, Reis 1 Min. mitrösten.","Nach und nach heiße Brühe dazu, ständig rühren, 18 Min.","Hähnchen, Pilze, Butter und Parmesan unterrühren."],"tip":"Risotto beim Aufwärmen mit etwas Wasser wieder cremig rühren."},"tortellini":{"name":"Käse-Tortellini in Spinat-Sahne","time":"20 Min.","por":"4 Portionen","ing":["1 kg Käse-Tortellini (Kühlregal)","2 Becher Sahne","450 g TK-Blattspinat (ohne Rahm)","50 g Parmesan","Knoblauch, Muskat, Salz, Pfeffer"],"steps":["Tortellini nach Packung kochen.","Spinat mit Sahne und Knoblauch aufkochen, 5 Min. köcheln.","Mit Muskat, Salz, Pfeffer abschmecken.","Tortellini unterheben, Parmesan drüber."],"tip":"Das schnellste warme Gericht im Plan – 20 Minuten."},"mercimek":{"name":"Mercimek Çorbası (Linsensuppe) mit Fladenbrot","time":"35 Min.","por":"4 Portionen","ing":["400 g rote Linsen","2 Kartoffeln","2 Möhren","1 Zwiebel, fein gewürfelt","2 EL Tomatenmark","30 g Butter","1 Zitrone","1 Fladenbrot","1,5 l Gemüsebrühe, Kreuzkümmel, Pul Biber, Salz"],"steps":["Zwiebel in Butter anbraten, Tomatenmark mitrösten.","Linsen, gewürfelte Kartoffel und Möhren mit Brühe dazu, 20 Min. köcheln.","Fein pürieren, mit Kreuzkümmel und Salz abschmecken.","Mit Zitrone, Pul Biber und Fladenbrot servieren."],"tip":"Wird beim Stehen dick – beim Aufwärmen Wasser nachgießen."},"nudelauflauf":{"name":"Pasta al forno (Hack-Nudel-Auflauf)","time":"45 Min.","por":"4 Portionen","ing":["500 g Penne","600 g Hackfleisch","1 l passierte Tomaten","2 Kugeln Mozzarella","100 g Reibekäse","1 kleine Zwiebel, fein gewürfelt","1 EL Öl","Oregano, Salz, Pfeffer, 1 TL Zucker"],"steps":["Nudeln 3 Min. kürzer kochen.","Hack mit Zwiebel braten, Tomaten und Gewürze dazu, 10 Min. köcheln.","Nudeln untermischen, in eine Form, Mozzarella und Reibekäse drauf.","Bei 200 °C 20 Min. überbacken."],"tip":"Portionsweise einfrieren – Ersatz für jede Pizzabestellung."},"kartoffelsuppe":{"name":"Kartoffelsuppe mit Speck","time":"40 Min.","por":"4 Portionen","ing":["1,5 kg Kartoffeln","3 Möhren","1 Zwiebel, fein gewürfelt","1 Becher Sahne","150 g Speckwürfel","4 Aufbackbrötchen","1,2 l Gemüsebrühe, Majoran, Muskat, Salz, Pfeffer"],"steps":["Speck knusprig braten, rausnehmen. Zwiebel im Fett anbraten.","Kartoffeln und Möhren würfeln, mit Brühe 20 Min. kochen.","Grob pürieren, Sahne dazu, abschmecken.","Mit Speck und Brötchen servieren."],"tip":"Ohne Speck mit Röstzwiebeln ist sie vegetarisch."},"pizza":{"name":"Pizza Margherita (fertiger Teig)","time":"25 Min.","por":"2 Portionen","ing":["1 Rolle Pizzateig","200 g passierte Tomaten","2 Kugeln Mozzarella","1 EL Olivenöl","Oregano, Salz, Basilikum"],"steps":["Ofen auf höchste Stufe (250 °C) vorheizen.","Teig ausrollen, Tomaten mit Salz und Oregano draufstreichen.","Mozzarella zupfen und verteilen, etwas Öl drüber.","Ganz unten 10–12 Min. backen."],"tip":"Belag nach Wunsch – mit Salami, Thunfisch oder Hähnchen."},"fishchips":{"name":"Fish & Chips mit Joghurt-Dip","time":"30 Min.","por":"2 Portionen","ing":["1 Packung Backfisch (TK)","500 g TK-Pommes","100 g Joghurt","2 EL Mayo","1 Zitrone","Salz, Dill oder Petersilie"],"steps":["Ofen auf 220 °C, Pommes auf ein Blech.","Nach 10 Min. Backfisch dazu, alles 15–20 Min. fertig backen.","Joghurt, Mayo, Kräuter und Zitronensaft verrühren.","Mit Zitronenspalten servieren."],"tip":"Alles auf einem Blech – kein Fett, kein Abwasch."},"lachsofen":{"name":"Ofenlachs mit Kartoffeln & Kräuterquark","time":"40 Min.","por":"2 Portionen","ing":["1 Packung Lachsfilet (TK, aufgetaut)","600 g Kartoffeln","250 g Magerquark","1 Zitrone","1 EL Öl","Kräuter (TK), Salz, Pfeffer"],"steps":["Ofen auf 200 °C. Kartoffeln halbieren, mit Öl und Salz 20 Min. backen.","Lachs dazulegen, salzen, Zitronenscheiben drauf, 15 Min. mitbacken.","Quark mit Kräutern, Salz und einem Schuss Wasser cremig rühren.","Zusammen servieren."],"tip":"Viel Eiweiß, wenig Aufwand – rund 600 kcal."},"halloumiburger":{"name":"Halloumi-Burger + Ofenpommes","time":"30 Min.","por":"2 Portionen","ing":["1 Packung Halloumi","4 Burgerbrötchen","ein paar Salatblätter","1 Tomate","2 EL Mayo","500 g TK-Pommes","Ketchup, Chiliflocken nach Wunsch"],"steps":["Pommes nach Packung backen.","Halloumi in dicke Scheiben schneiden und ohne Öl goldbraun braten.","Brötchen kurz anrösten.","Mit Mayo, Salat, Tomate und Halloumi belegen."],"tip":"Etwas Honig auf den heißen Halloumi – süß-salzig wie im Burgerladen."},"nuggets":{"name":"Chicken Nuggets aus dem Ofen + Pommes","time":"35 Min.","por":"2 Portionen","ing":["400 g Hähnchenbrust","1 Ei","3 EL Mehl","80 g Paniermehl oder Cornflakes","500 g TK-Pommes","2 EL Mayo","2 EL Öl","Paprikapulver, Knoblauchpulver, Salz"],"steps":["Ofen auf 220 °C. Hähnchen in Nugget-Stücke schneiden, würzen.","Erst in Mehl, dann Ei, dann Paniermehl wenden.","Auf ein Blech, mit Öl beträufeln, mit den Pommes 18 Min. backen, einmal wenden.","Mit Mayo oder Ketchup dippen."],"tip":"Mit zerdrückten Cornflakes wird die Kruste noch knuspriger."},"fajitas":{"name":"Hähnchen-Fajitas","time":"25 Min.","por":"2 Portionen","ing":["400 g Hähnchenbrust","2 Paprika","1 kleine Zwiebel, in feinen Streifen","4 Wraps","100 g Reibekäse","150 g Joghurt oder Schmand","1 EL Öl","Fajita- oder Taco-Gewürz, Salz, Limette"],"steps":["Hähnchen und Paprika in Streifen schneiden.","Hähnchen scharf anbraten, Paprika und Zwiebel dazu, 5 Min. braten, würzen.","Wraps kurz in der trockenen Pfanne erwärmen.","Füllen mit Hähnchen, Käse und Joghurt."],"tip":"Jeder rollt selbst – perfekt, wenn Freunde da sind."},"menemen":{"name":"Menemen mit Fladenbrot","time":"20 Min.","por":"2 Portionen","ing":["5 Eier","400 g Tomaten","1 Spitzpaprika","20 g Butter","1 Fladenbrot","Pul Biber, Salz, Pfeffer"],"steps":["Paprika fein würfeln und in Butter 4 Min. braten.","Tomaten würfeln, dazu, 5 Min. einkochen.","Eier verquirlen, unterrühren und nur kurz stocken lassen – soll saftig bleiben.","Mit Pul Biber und Fladenbrot servieren."],"tip":"Mit etwas Feta oder Sucuk wird's noch besser."},"pulledchicken":{"name":"Pulled-Chicken-Burger + Pommes","time":"35 Min.","por":"2 Portionen","ing":["500 g Hähnchenschenkel ohne Knochen","5 EL Ketchup","1 EL Honig","4 Burgerbrötchen","halbe Gurke","2 EL Mayo","500 g TK-Pommes","Paprikapulver geräuchert, Knoblauch, Salz, 1 EL Essig"],"steps":["Hähnchen mit Gewürzen anbraten, mit 200 ml Wasser 20 Min. zugedeckt schmoren.","Pommes backen.","Fleisch mit zwei Gabeln zerzupfen, mit Ketchup, Honig und Essig zu BBQ-Soße einkochen.","Brötchen mit Mayo, Gurke und Pulled Chicken belegen."],"tip":"Schenkel bleiben saftiger als Brust – beim Pulled Chicken ein Muss."},"garnelen":{"name":"Knoblauch-Garnelen-Spaghetti","time":"20 Min.","por":"2 Portionen","ing":["1 Packung Garnelen (TK, aufgetaut)","250 g Spaghetti","40 g Butter","1 Zitrone","1 EL Olivenöl","3 Knoblauchzehen, Chiliflocken, Petersilie, Salz"],"steps":["Spaghetti kochen, eine Tasse Nudelwasser aufheben.","Knoblauch in Öl und Butter kurz anbraten.","Garnelen 3 Min. braten, bis sie rosa sind.","Spaghetti, Zitronensaft und etwas Nudelwasser dazu, schwenken."],"tip":"Garnelen nicht zu lange braten – sonst werden sie gummiartig."},"rindgeschnetzeltes":{"name":"Rindergeschnetzeltes mit Kartoffelpüree","time":"35 Min.","por":"2 Portionen","ing":["400 g Rind (Gulasch oder Hüfte, in Streifen)","250 g Champignons","1 Becher Sahne","700 g Kartoffeln","150 ml Milch","30 g Butter","1 EL Öl","Senf, Paprikapulver, Salz, Pfeffer"],"steps":["Kartoffeln kochen und mit Milch und Butter stampfen.","Rindfleisch in sehr dünne Streifen schneiden, portionsweise scharf anbraten.","Pilze braten, Sahne und 1 TL Senf dazu, 3 Min. köcheln.","Fleisch zurück, nur noch kurz erhitzen."],"tip":"Fleisch angefroren schneidet sich viel dünner."},"armeritter":{"name":"Arme Ritter mit Zimt-Zucker","time":"15 Min.","por":"2 Portionen","ing":["8 Scheiben Toast (gern vom Vortag)","2 Eier","200 ml Milch","20 g Butter","2 EL Zucker","Zimt, Prise Salz"],"steps":["Eier mit Milch und Salz verquirlen.","Toast kurz darin einweichen.","In Butter von beiden Seiten goldbraun braten.","Mit Zimt-Zucker bestreuen."],"tip":"Altes Brot wird so zur Nachspeise – nichts wegwerfen."},"griessbrei":{"name":"Grießbrei mit Kirschen","time":"15 Min.","por":"2 Portionen","ing":["750 ml Milch","100 g Grieß","3 EL Zucker","1 Glas Sauerkirschen","Prise Salz, Zimt"],"steps":["Milch mit Zucker und Salz aufkochen.","Grieß einrieseln lassen, dabei rühren.","Bei kleiner Hitze 5 Min. quellen lassen.","Mit Kirschen und Zimt servieren."],"tip":"Die Kirschen kurz mit etwas Saft und Stärke andicken – dann wird's wie Grütze."},"pancakes":{"name":"American Pancakes mit Banane","time":"25 Min.","por":"2 Portionen","ing":["200 g Mehl","2 Eier","250 ml Milch","2 Bananen","2 EL Zucker","20 g Butter","2 TL Backpulver, Prise Salz, Honig oder Sirup"],"steps":["Mehl, Backpulver, Zucker und Salz mischen.","Eier und Milch dazu, kurz zu einem dicken Teig rühren.","Kleine Pancakes in Butter braten, wenden, wenn Blasen kommen.","Mit Bananenscheiben und Honig stapeln."],"tip":"Teig nur kurz rühren – kleine Klümpchen machen sie fluffig."},"quarkauflauf":{"name":"Quark-Grieß-Auflauf mit Apfelmus","time":"50 Min.","por":"2 Portionen","ing":["500 g Magerquark","80 g Grieß","2 Eier","4 EL Zucker","300 g Apfelmus","1 Päckchen Vanillezucker, Zimt"],"steps":["Ofen auf 180 °C.","Quark, Grieß, Eier, Zucker und Vanillezucker verrühren.","Apfelmus in eine Form, Quarkmasse drüber.","35 Min. goldgelb backen."],"tip":"Viel Eiweiß – süß und trotzdem sättigend."},"kokosmilchreis":{"name":"Kokos-Milchreis mit Mango","time":"35 Min.","por":"2 Portionen","ing":["250 g Milchreis","2 Dosen Kokosmilch","3 EL Zucker","300 g TK-Mango","Prise Salz, Vanille"],"steps":["Kokosmilch mit 300 ml Wasser, Zucker und Salz aufkochen.","Reis dazu, bei kleiner Hitze 30 Min. quellen lassen, ab und zu rühren.","Mango auftauen lassen und würfeln.","Milchreis mit Mango servieren."],"tip":"Ganz ohne Milch, Ei und Gluten – passt bei vielen Allergien."},"kartoffelcurry":{"name":"Kartoffel-Erbsen-Curry mit Kokos","time":"35 Min.","por":"4 Portionen","ing":["1,2 kg Kartoffeln","300 g TK-Erbsen & Möhren","2 Dosen Kokosmilch","500 g passierte Tomaten","1 Zwiebel, fein gewürfelt","2 EL Öl","2 EL Currypulver, 1 TL Kurkuma, Salz, Chiliflocken nach Wunsch"],"steps":["Kartoffeln in 2-cm-Würfel schneiden.","Zwiebel in Öl anbraten, Curry und Kurkuma 1 Min. mitrösten.","Kartoffeln, Tomaten und Kokosmilch dazu, 20 Min. köcheln, bis die Kartoffeln weich sind.","Erbsen die letzten 5 Min. mitkochen, salzen."],"tip":"Ohne Reis schon sättigend – die Kartoffeln binden die Soße."},"reisbohnenbowl":{"name":"Mexikanische Reis-Bohnen-Bowl","time":"25 Min.","por":"4 Portionen","ing":["300 g Reis","2 Dosen Kidneybohnen","1 Dose Mais","250 g Tomaten","1 Gurke","1 Zitrone","3 EL Öl","Kreuzkümmel, Paprikapulver, Chiliflocken, Salz"],"steps":["Reis kochen und abkühlen lassen.","Bohnen abspülen, mit Gewürzen und 1 EL Öl 5 Min. anbraten.","Tomaten und Gurke würfeln.","Alles mit Mais, Zitronensaft und restlichem Öl in Boxen schichten."],"tip":"Schmeckt kalt – perfekt zum Mitnehmen."},"wedges":{"name":"Ofen-Wedges mit Chili-Bohnen","time":"40 Min.","por":"2 Portionen","ing":["800 g Kartoffeln","1 Dose Kidneybohnen","1 Dose Mais","200 g passierte Tomaten","3 EL Öl","Paprikapulver, Knoblauchpulver, Chiliflocken, Salz"],"steps":["Ofen auf 220 °C. Kartoffeln in Spalten schneiden, mit 2 EL Öl und Gewürzen mischen, 30 Min. backen.","Bohnen und Mais mit Tomaten und Gewürzen 10 Min. köcheln.","Wedges auf Teller, Chili-Bohnen drüber.","Nach Wunsch mit Joghurt oder Käse."],"tip":"Wedges nicht übereinander legen – nur so werden sie knusprig."}};
