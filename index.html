var STEPS_X={"oats":["bowl|||Joghurt oder Skyr in eine Schüssel geben.","mix|||Süßungsmittel dazu (2–3 Spritzer reichen) und glatt rühren.","serve|||Müsli obendrauf streuen – fertig.","box|||Zum Mitnehmen: Joghurt in eine Box, Müsli extra in ein kleines Glas. Erst kurz vorm Essen mischen, sonst wird es matschig."],"drumsticks":["oven|o210|10|Ofen auf 210 °C Umluft vorheizen (dauert ca. 10 Min.). Blech mit Backpapier auslegen.","prep|||Drumsticks aus der Packung nehmen und mit Küchenpapier gründlich trocken tupfen – je trockener, desto knuspriger. Danach Hände waschen.","mix|||In einer großen Schüssel Öl, Honig, Sojasoße und alle Gewürze verrühren. Drumsticks rein und mit den Händen rundum einreiben.","oven|||Mit etwas Abstand aufs erste Blech legen (nicht übereinander).","wash|||Kartoffeln unter fließendem kaltem Wasser abbürsten oder mit den Händen abreiben, bis keine Erde mehr dran ist.","cut|||Kartoffeln mit Schale längs halbieren, dann jede Hälfte in 3–4 Spalten schneiden. Mit 2 EL Öl, Salz und Paprika mischen und aufs zweite Blech legen.","oven|o210|20|Beide Bleche in den Ofen, 20 Min. backen.","oven|o210|20|Drumsticks und Wedges wenden, weitere 20–25 Min. backen. Fertig, wenn die Haut dunkelbraun-knusprig ist und beim Anstechen klarer Saft austritt.","mix|||In der Zwischenzeit die zwei Dips in zwei kleinen Schüsseln jeweils glatt rühren und in kleine Gläser füllen.","box|||In 4 Boxen verteilen, Dips getrennt lassen. Abkühlen lassen, dann in den Kühlschrank. Aufwärmen am besten im Ofen (200 °C, 10 Min.) – bleibt knuspriger als in der Mikrowelle."],"sesam":["wash|||Den Reis in einen Topf geben, kaltes Wasser drauf, mit der Hand umrühren und das trübe Wasser abgießen. 2× wiederholen, bis das Wasser fast klar ist.","pot|9||Frisches Wasser dazu: pro 100 g Reis 130 ml (400 g Reis = 520 ml). Deckel drauf und aufkochen lassen (ca. 4 Min.).","pot|2|15|Sobald es sprudelt: auf Stufe 1–2 runterschalten. Deckel bleibt drauf – nicht reinschauen! 15 Min. garen.","rest||10|Herd aus, Topf stehen lassen, Deckel weiter drauf: 10 Min. ruhen. Danach mit einer Gabel auflockern.","cut|||Hähnchen nicht abwaschen (verteilt Keime), nur mit Küchenpapier trocken tupfen. In ca. 2 cm große Würfel schneiden.","wash|||Brett, Messer und Hände danach mit heißem Wasser und Spülmittel waschen.","mix|||Hähnchenwürfel in einer Schüssel mit der Speisestärke mischen, bis alles leicht weiß bepudert ist.","mix|||Soße in einer Tasse anrühren: Sojasoße, Honig, Essig, Knoblauchpulver und 100 ml Wasser.","pan|8|8|Pfanne mit ca. 4 EL Öl auf Stufe 8 heiß werden lassen. Die Hälfte vom Hähnchen rein, 3 Min. nicht bewegen, dann wenden und weitere 3–4 Min. braten, bis alles goldbraun und knusprig ist. Rausnehmen, zweite Runde genauso.","pan|6|3|Alles Hähnchen zurück in die Pfanne, Stufe 6. Soße drübergießen und ca. 2–3 Min. rühren, bis sie dick wird und glänzt.","serve|||Sesam drüberstreuen. Gurke waschen und in Scheiben schneiden.","box|||In 4 Boxen verteilen und ca. 20 Min. offen abkühlen lassen, dann Deckel drauf und ab in den Kühlschrank (hält 3 Tage).","micro|||Aufwärmen: Deckel ankippen, 2–3 Min. bei 800 W in die Mikrowelle, einmal umrühren."],"teriyaki":["wash|||Den Reis in einen Topf geben, kaltes Wasser drauf, mit der Hand umrühren und das trübe Wasser abgießen. 2× wiederholen, bis das Wasser fast klar ist.","pot|9||Frisches Wasser dazu: pro 100 g Reis 130 ml (400 g Reis = 520 ml). Deckel drauf und aufkochen lassen (ca. 4 Min.).","pot|2|15|Sobald es sprudelt: auf Stufe 1–2 runterschalten. Deckel bleibt drauf – nicht reinschauen! 15 Min. garen.","rest||10|Herd aus, Topf stehen lassen, Deckel weiter drauf: 10 Min. ruhen. Danach mit einer Gabel auflockern.","cut|||Hähnchen nicht abwaschen (verteilt Keime), nur mit Küchenpapier trocken tupfen. In ca. 2 cm große Würfel schneiden.","wash|||Brett, Messer und Hände danach mit heißem Wasser und Spülmittel waschen.","mix|||Soße in einer Tasse anrühren: Sojasoße, Honig, Knoblauchpulver, Speisestärke und 100 ml Wasser.","pan|8|6|Große Pfanne mit 1–2 EL Öl auf Stufe 8 heiß werden lassen (ca. 2 Min. – das Öl wird dünnflüssig). Das Hähnchen rein, 2 Min. nicht bewegen, dann wenden. Insgesamt ca. 6 Min. braten, bis es rundum goldbraun und innen nicht mehr rosa ist. Bei viel Fleisch in 2 Runden braten.","pan|6|3|Auf Stufe 6 runter, Soße in die Pfanne gießen und 3 Min. rühren, bis sie dick ist und glänzt.","sieve|||Mais in ein Sieb abgießen. Gurke waschen, Enden abschneiden, in Scheiben schneiden.","box|||In 4 Boxen verteilen und ca. 20 Min. offen abkühlen lassen, dann Deckel drauf und ab in den Kühlschrank (hält 3 Tage).","micro|||Aufwärmen: Deckel ankippen, 2–3 Min. bei 800 W in die Mikrowelle, einmal umrühren."],"burrito":["pan|8|7|Große Pfanne mit 1 EL Öl auf Stufe 8 heiß werden lassen. Hack rein und mit dem Pfannenwender in kleine Krümel zerdrücken. Ca. 7 Min. braten, bis nichts mehr rosa ist und es leicht braun wird.","pan|6|1|Auf Stufe 6. Tomatenmark und Gewürz dazu, 1 Min. unter Rühren mitbraten, dann 100 ml Wasser dazugießen.","sieve|||Bohnen und Mais in ein Sieb abgießen und kurz mit kaltem Wasser abspülen.","pan|4|5|Bohnen und Mais unterrühren, auf Stufe 4 ca. 5 Min. köcheln lassen. Dann vom Herd nehmen und 15 Min. abkühlen lassen (heiße Füllung reißt die Wraps).","wrap|||Wrap: Wrap flach hinlegen, 3–4 EL Füllung und etwas Käse in die Mitte. Links und rechts einschlagen, dann von unten fest aufrollen. In Alufolie wickeln.","bowl|||Bowl: Reis kochen (wie bei Sticky-Reis), Füllung, Käse und Gurke draufgeben.","box|||In den Kühlschrank (hält 3 Tage). Aufwärmen: ohne Folie 1–2 Min. in die Mikrowelle oder kalt essen."],"bolognese":["cut|||Die Zwiebel schälen: oben und unten abschneiden, Schale abziehen. Halbieren und in ganz kleine Würfel schneiden (ca. 3 mm).","pot|8|8|Größten Topf mit 2 EL Öl auf Stufe 8 heiß werden lassen. Die Hälfte vom Hack rein, zerkrümeln und ca. 8 Min. braten, bis es braun ist (nicht nur grau). Rausnehmen, zweite Hälfte genauso. Alles zurück in den Topf.","pot|6|4|Auf Stufe 6. Zwiebelwürfel dazu, 3–4 Min. mitbraten, bis sie goldbraun sind.","pot|6|2|Tomatenmark dazu und 2 Min. unter Rühren rösten – es wird dunkler und riecht süßlich.","pot|9||Passierte Tomaten, Knoblauchpulver, Oregano, Zucker, 1 TL Salz, Pfeffer und 200 ml Wasser dazu. Einmal aufkochen lassen.","pot|3|60|Auf Stufe 2–3 runter, Deckel schräg drauf. Mindestens 1 Std. leise blubbern lassen, alle 10–15 Min. umrühren (auch am Boden), damit nichts anbrennt.","mix|||Abschmecken: Salz oder Zucker nachgeben, wenn es zu sauer ist.","pot|9|8|Großen Topf mit ca. 3 l Wasser füllen, Deckel drauf und zum Sprudeln bringen (ca. 8 Min.).","pot|7|10|1 EL Salz ins Wasser, dann die Spaghetti rein und einmal umrühren. Ohne Deckel kochen – genaue Zeit steht auf der Packung (meist 9–11 Min.). Zwischendurch umrühren, damit nichts klebt.","sieve|||Vor dem Abgießen eine Tasse Nudelwasser abschöpfen (macht Soßen cremig). Dann im Sieb abgießen – nicht kalt abspülen.","serve|||4 Portionen mit Spaghetti essen oder in Boxen packen.","freeze|||Den Rest ca. 1 Std. abkühlen lassen, in 8 Gefrierboxen füllen, mit Datum beschriften und einfrieren (hält 3 Monate). Auftauen: am Vortag in den Kühlschrank legen."],"bratkartoffeln":["wash|||Kartoffeln unter fließendem kaltem Wasser abbürsten oder mit den Händen abreiben, bis keine Erde mehr dran ist.","pot|9||Ein paar Stunden vorher (oder am Vortag): Kartoffeln mit Schale in einen Topf, mit kaltem Wasser bedecken, 1 TL Salz rein. Deckel drauf und aufkochen.","pot|5|20|Auf Stufe 5 runter, 18–20 Min. kochen. Sie sollen fast gar sein: Messer geht rein, aber mit leichtem Widerstand.","cool|||Abgießen und komplett auskühlen lassen, dann in den Kühlschrank. Kalte Kartoffeln zerfallen nicht und werden knuspriger.","peel|||Wenn sie kalt sind: Schale mit den Fingern oder einem Messer abziehen. In 5 mm dicke Scheiben schneiden.","pan|8|2|Große Pfanne mit 2 EL Butterschmalz (oder Öl) auf Stufe 8 richtig heiß werden lassen – ein Tropfen Wasser zischt sofort.", nchenbrust trocken tupfen und waagerecht halbieren, damit sie dünner ist. Mit Salz, Pfeffer und Paprika würzen.","pan|7|10|Pfanne mit 1 EL Öl auf Stufe 7. Hähnchen 4–5 Min. pro Seite braten, bis es innen weiß ist (Probeschnitt in der dicksten Stelle).","cool|||Auf ein Brett legen, 10 Min. abkühlen lassen, dann in Streifen schneiden.","mix|||Dressing in einer Schüssel glatt rühren: Skyr, Mayo, Senf, Zitronensaft, Knoblauchpulver, Salz, Pfeffer.","wash|||Salatblätter abzupfen, waschen, trocken schleudern oder mit Küchenpapier trocknen, in feine Streifen schneiden.","mix|||Salat mit Dressing und Parmesan mischen.","wrap|||Wrap flach hinlegen, Salat und Hähnchen in die Mitte, Seiten einschlagen, fest aufrollen, in Alufolie wickeln. Kühl lagern, kalt essen."],"broetchen":["oven|o200|10|Ofen auf 200 °C Umluft vorheizen (dauert ca. 10 Min.). Blech mit Backpapier auslegen.","oven|o200|9|Brötchen direkt aufs Gitter legen, 8–10 Min. aufbacken, bis sie goldbraun sind.","cut|||Kurz abkühlen lassen, dann aufschneiden. Frischkäse oder Butter draufstreichen, Aufschnitt und Käse drauf.","pan|5|4|Wer Zeit hat: 2 Spiegeleier auf Stufe 5 in etwas Öl ca. 4 Min. braten und dazu essen – macht richtig satt."],"geschnetzeltes":["wash|||Den Reis in einen Topf geben, kaltes Wasser drauf, mit der Hand umrühren und das trübe Wasser abgießen. 2× wiederholen, bis das Wasser fast klar ist.","pot|9||Frisches Wasser dazu: pro 100 g Reis 130 ml (400 g Reis = 520 ml). Deckel drauf und aufkochen lassen (ca. 4 Min.).","pot|2|15|Sobald es sprudelt: auf Stufe 1–2 runterschalten. Deckel bleibt drauf – nicht reinschauen! 15 Min. garen.","rest||10|Herd aus, Topf stehen lassen, Deckel weiter drauf: 10 Min. ruhen. Danach mit einer Gabel auflockern.","cut|||Hähnchen nicht abwaschen (verteilt Keime), nur mit Küchenpapier trocken tupfen. In ca. 1 cm dünne Streifen schneiden.","wash|||Brett, Messer und Hände danach mit heißem Wasser und Spülmittel waschen.","cut|||Die kleine Zwiebel schälen: oben und unten abschn  in kochendem Salzwasser garen, abgießen. Speck in einer kleinen Pfanne auf Stufe 6 knusprig braten, Bohnen darin schwenken.","cut|||Steak quer zur Faser in fingerdicke Streifen schneiden, pfeffern. Mit Soße, Pommes und Speckbohnen servieren."],"butterchicken":["cut|||Hähnchen nicht abwaschen (verteilt Keime), nur mit Küchenpapier trocken tupfen. In ca. 2 cm große Würfel schneiden.","wash|||Brett, Messer und Hände danach mit heißem Wasser und Spülmittel waschen.","mix|||Hähnchen in einer Schüssel mit Joghurt, der Hälfte der Gewürze und 1 TL Salz mischen. 20 Min. ziehen lassen (ruhig länger im Kühlschrank).","wash|||Den Reis in einen Topf geben, kaltes Wasser drauf, mit der Hand umrühren und das trübe Wasser abgießen. 2× wiederholen, bis das Wasser fast klar ist.","pot|9||Frisches Wasser dazu: pro 100 g Reis 130 ml (400 g Reis = 520 ml). Deckel drauf und aufkochen lassen (ca. 4 Min.).","pot|2|15|Sobald es sprudelt: auf Stufe 1–2 runterschalten. Deckel bleibt drauf – nicht reinschauen! 15 Min. garen.","rest||10|Herd aus, Topf stehen lassen, Deckel weiter drauf: 10 Min. ruhen. Danach mit einer Gabel auflockern.","pan|8|6|Pfanne mit 1 EL Öl auf Stufe 8. Hähnchen in 2 Runden je ca. 3 Min. kräftig anbraten, bis es Farbe hat. Rausnehmen.","pan|5|1|Auf Stufe 5. Butter in die Pfanne, Tomatenmark und die restlichen Gewürze rein, 1 Min. rühren.","pan|4|10|Passierte Tomaten dazu, auf Stufe 4 ca. 10 Min. leise köcheln, ab und zu umrühren.","pan|3|5|Sahne und Zucker einrühren, Hähnchen zurück, 5 Min. auf Stufe 3 ziehen lassen. Mit Salz abschmecken.","box|||In 4 Boxen verteilen und ca. 20 Min. offen abkühlen lassen, dann Deckel drauf und ab in den Kühlschrank (hält 3 Tage).","micro|||Aufwärmen: Deckel ankippen, 2–3 Min. bei 800 W in die Mikrowelle, einmal umrühren."],"frikadellen":["cut|||Die kleine Zwiebel schälen: oben und unten abschneiden, Schale abziehen. Halbieren und in ganz kleine Würfel schneiden (ca. 3 mm).","pan|5|4|Zwiebelwürfel mit 1 TL Öl auf Stufe 5 ca. 4 Min. goldbraun braten, dann abkühlen lassen.","mix|||Brötchen 5 Min. in Wasser einweichen und gut ausdrücken (oder Paniermehl nehmen). Mit Hack, Eiern, Senf, Zwiebel, 1 TL Salz, Pfeffer und Paprika in einer Schüssel 2 Min. kräftig mit den Händen verkneten.","prep|||Mit nassen Händen 10 flache Frikadellen formen (ca. 2 cm dick). Hände waschen.","pan|5|12|Pfanne mit 2 EL Öl auf Stufe 5–6. Frikadellen pro Seite 5–6 Min. braten. Fertig, wenn sie innen nicht mehr rosa sind (Probeschnitt).","wash|||Kartoffeln unter fließendem kaltem Wasser abbürsten oder mit den Händen abreiben, bis keine Erde mehr dran ist.","peel|||Mit dem Sparschäler schälen, dunkle Stellen und „Augen“ mit der Messerspitze rausschneiden. Dann in gleich große Stücke (ca. 4 cm) schneiden.","pot|9||Kartoffeln in einen Topf, mit Wasser bedecken, 1 TL Salz, Deckel drauf, aufkochen.","pot|5|20|Auf Stufe 5 ca. 20 Min. kochen, bis ein Messer ganz leicht reingeht.","mix|||Abgießen. Milch kurz erwärmen, mit Butter, Muskat und Salz zu den Kartoffeln geben und mit dem Stampfer zerdrücken.","pan|4|4|Rahmsoße: 1 TL Mehl ins Bratfett der Frikadellen, 1 Min. rühren, dann Sahne, 100 ml Wasser und Brühe einrühren, 3 Min. köcheln.","pot|5|5|Erbsen & Möhren mit 3 EL Wasser 5 Min. garen, mit Butter schwenken.","box|||Übrige Frikadellen abkühlen lassen und in eine Box – schmecken kalt in der Uni."],"gebratenenudeln":["pot|9|8|Großen Topf mit ca. 3 l Wasser füllen, Deckel drauf und zum Sprudeln bringen (ca. 8 Min.).","pot|7|10|1 EL Salz ins Wasser, dann die Mie-Nudeln (oder Spaghetti) rein und einmal umrühren. Ohne Deckel kochen – genaue Zeit steht auf der Packung (meist 9–11 Min.). Zwischendurch umrühren, damit nichts klebt.","sieve|||Vor dem Abgießen eine Tasse Nudelwasser abschöpfen (macht Soßen cremig). Dann im Sieb abgießen – nicht kalt abspülen.","mix|||Nudeln mit 1 EL Öl mischen, damit sie nicht zusammenkleben.","cut|||Hähnchen nicht abwaschen (verteilt Keime), nur mit Küchenpapier trocken tupfen. In dünne Streifen schneiden.","wash|||Brett, Messer und Hände danach mit heißem Wasser und Spülmittel waschen.","mix|||Soße anrühren: Sojasoße, Honig, Knoblauchpulver, Chili.","pan|8|5|Große Pfanne mit 1–2 EL Öl auf Stufe 8 heiß werden lassen (ca. 2 Min. – das Öl wird dünnflüssig). Die Hähnchenstreifen rein, 2 Min. nicht bewegen, dann wenden. Insgesamt ca. 5 Min. braten, bis sie goldbraun sind. Rausnehmen. Bei viel Fleisch in 2 Runden braten.","pan|8|3|Erbsen & Möhren in die Pfanne, 3 Min. braten.","pan|7|2|Gemüse an den Rand schieben, Eier in die Mitte schlagen und verrühren, bis sie stocken (ca. 1–2 Min.).","pan|9|3|Nudeln, Hähnchen und Soße dazu, auf Stufe 9 ca. 3 Min. ständig schwenken und wenden.","box|||In 4 Boxen verteilen und ca. 20 Min. offen abkühlen lassen, dann Deckel drauf und ab in den Kühlschrank (hält 3 Tage).","micro|||Aufwärmen: Deckel ankippen, 2–3 Min. bei 800 W in die Mikrowelle, einmal umrühren."],"friedrice":["cool|||Reis schon am Vortag kochen (wie Sticky-Reis) und offen im Kühlschrank kalt werden lassen – frischer Reis wird matschig.","cut|||Hähnchen nicht abwaschen (verteilt Keime), nur mit Küchenpapier trocken tupfen. In kleine Würfel (1 cm) schneiden.","wash|||Brett, Messer und Hände danach mit heißem Wasser und Spülmittel waschen.","pan|8|5|Große Pfanne mit 1–2 EL Öl auf Stufe 8 heiß werden lassen (ca. 2 Min. – das Öl wird dünnflüssig). Das Hähnchen rein, 2 Min. nicht bewegen, dann wenden. Insgesamt ca. 5 Min. braten, bis es goldbraun ist. Rausnehmen. Bei viel Fleisch in 2 Runden braten.","pan|8|3|Erbsen & Möhren 3 Min. braten.","pan|7|2|Eier dazuschlagen, verrühren und stocken lassen.","pan|9|5|Kalten Reis dazu, Klumpen mit dem Pfannenwender zerdrücken. 5 Min. auf Stufe 9 braten, dabei nur alle 30 Sek. wenden – so wird er leicht knusprig.","pan|9|1|Hähnchen, Sojasoße, Knoblauch, Zucker und Chili dazu, 1 Min. durchschwenken.","box|||In 4 Boxen verteilen und ca. 20 Min. offen abkühlen lassen, dann Deckel drauf und ab in den Kühlschrank (hält 3 Tage).","micro|||Aufwärmen: Deckel ankippen, 2–3 Min. bei 800 W in die Mikrowelle, einmal umrühren."],"spaetzle":["oven|o200|10|Ofen auf 200 °C Umluft vorheizen (dauert ca. 10 Min.). Blech mit Backpapier auslegen.","pan|6|5|Speckwürfel ohne Öl in einer großen Pfanne auf Stufe 6 ca. 5 Min. knusprig braten. Mit einem Löffel rausnehmen, Fett in der Pfanne lassen.","pan|7|4|Spätzle in die Pfanne und auf Stufe 7 ca. 4 Min. anbraten, ab und zu wenden.","bowl|||In eine Auflaufform schichten: Spätzle, Käse, Speck – nochmal wiederholen. Oben Käse.","mix|||Sahne gleichmäßig drübergießen, mit Pfeffer und etwas Muskat würzen.","oven|o200|15|15 Min. backen, bis der Käse blubbert und oben leicht braun ist. Optional: Röstzwiebeln obendrauf."],"gnocchi":["pan|7|10|Gnocchi NICHT kochen: Große Pfanne mit 2 EL Öl auf Stufe 7, Gnocchi in einer Lage rein, 8–10 Min. braten und alle 2 Min. wenden, bis sie rundum goldbraun und knusprig sind. Rausnehmen.","pan|6|5|Speck in dieselbe Pfanne, auf Stufe 6 ca. 5 Min. knusprig braten.","pan|5|4|Gefrorenen Spinat dazu, ca. 3–4 Min. rühren, bis er aufgetaut ist.","pan|4|3|Sahne, Knoblauch, Pfeffer und Muskat dazu, 3 Min. leise köcheln. Parmesan reinreiben und einrühren.","pan|4|1|Gnocchi zurück in die Soße, kurz schwenken und sofort essen (werden sonst weich)."],"pfannkuchen":["mix|||Eier, Mehl, Milch, Zucker und eine Prise Salz in eine Schüssel, mit dem Schneebesen glatt rühren, bis keine Klümpchen mehr da sind.","rest||10|Teig 10 Min. stehen lassen.","pan|6|2|Pfanne auf Stufe 6 heiß werden lassen, ein kleines Stück Butter rein und verteilen.","pan|6|2|Eine Kelle Teig rein und die Pfanne sofort schwenken, damit der Boden dünn bedeckt ist. 1–2 Min. backen, bis der Rand sich löst und unten goldbraun ist.","pan|6|1|Mit dem Pfannenwender wenden, 1 Min. backen. Auf einen Teller, nächsten genauso (vorher wieder etwas Butter).","serve|||Mit Nutella, Apfelmus oder Zimt-Zucker füllen und aufrollen."],"milchreis":["pot|6|5|Milch, Zucker, Salz und Butter in einen Topf. Auf Stufe 6     rows+='<div class="obwk"><b>Woche '+r+'</b><span>'+[dish(g.bowl,"bowl"),dish(g.pasta,"pasta"),dish(g.fake,"fake")].map(function(x){return esc(genTx(x[0]).split(" (")[0]);}).join(" · ")+'</span></div>'; }
  PROF=keep; PF=keepPF;
  var avg=costs.reduce(function(a,b){return a+b;},0)/costs.length, meal=avg/21, save=Math.max(0,Math.round(d.order*(1-meal/13)/5)*5);
  return '<div class="obstats"><div><b>'+Math.round(avg)+' €</b><span>pro Woche</span></div><div><b>'+meal.toFixed(2).replace(".",",")+' €</b><span>pro Mahlzeit</span></div><div><b>'+calcKcal(d).toLocaleString("de-DE")+'</b><span>kcal am Tag</span></div></div>'+
    (save>0?'<p class="obsave">Statt zu bestellen sparst du bis zu <b>'+save+' € im Monat</b>.</p>':'')+
    '<div class="obweeks">'+rows+'</div><p class="obhint">'+DOW_LONG[d.shopDay]+' einkaufen, '+DOW_LONG[(d.shopDay+2)%7]+' großer Kochtag, '+DOW_LONG[(d.shopDay+5)%7]+' Fakeaway. Alles lässt sich später unter Vorrat neu einstellen.</p>';
}
function obRender(){
  var st=OB_STEPS[OB.step](OB.d), n=OB_STEPS.length, last=OB.step===n-1, el=document.getElementById("ob");
  el.innerHTML='<div class="obtop"><div class="obbar"><i style="width:'+((OB.step+1)/n*100)+'%"></i></div><span>'+(OB.step+1)+' / '+n+'</span>'+(OB.again?'<button class="obx" data-obx="1" aria-label="Fragebogen schließen">✕</button>':'')+'</div>'+
    '<div class="obscroll"><div class="obhead"><span class="obav">'+FS_AV+'</span><p class="obq" id="obq">'+esc(st.q)+'</p></div><div class="obbody">'+st.b+'</div></div>'+
    '<div class="obfoot">'+(OB.step>0?'<button class="btn ghost" data-obnav="-1">Zurück</button>':'<span></span>')+'<button class="btn obgo" data-obnav="1">'+(last?'Los geht\'s':(OB.step===0?'Starten':'Weiter'))+'</button></div>';
  var sc=el.querySelector(".obscroll"); if(sc) sc.scrollTop=0;
}
function obInput(e){ var k=e.target.dataset.in; if(!k) return; OB.d[k]=e.target.value; var kc=document.getElementById("obkcal"); if(kc) kc.innerHTML='Dein Bedarf: ca. <b>'+calcKcal(OB.d).toLocaleString("de-DE")+' kcal</b> pro Tag. Bleibt nur auf deinem Handy.'; }
function obClick(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.k){ var k=b.dataset.k, v=obVal(k,b.dataset.v);
    if(b.dataset.m==="1"){ var a=OB.d[k], i=a.indexOf(v); if(i>=0) a.splice(i,1); else { a.push(v); if(k==="bf"){ if(v==="none") OB.d.bf=["none"]; else { var j=a.indexOf("none"); if(j>=0) a.splice(j,1); } } } }
    else OB.d[k]=v;
    obRender(); return; }
  if(b.dataset.obnav){ var dir=+b.dataset.obnav;
    if(dir>0&&OB.step===OB_STEPS.length-1){ obFinish(); return; }
    if(OB.step===0) OB.d.name=String(OB.d.name||"").trim();
    OB.step=Math.max(0,Math.min(OB_STEPS.length-1,OB.step+dir)); obRender(); return; }
  if(b.dataset.yunus){ save("profile",{mode:"yunus",name:"Yunus",shopDay:1,car:true,papa:true,kcal:3000}); location.reload(); return; }
  if(b.dataset.obx){ document.getElementById("ob").classList.remove("open"); document.body.classList.remove("ob-open"); return; }
}
function obFinish(){
  var d=OB.d; d.mode="custom"; d.kcal=calcKcal(d); d.papa=false; if(!d.name) d.name="";
  save("profile",d);
  var t=today(), off=(d.shopDay-t.getDay()+7)%7; save("start2", fmtISO(addDays(t,off)));
  location.hash="heute"; location.reload();
}
document.addEventListener("click",function(e){ var b=e.target.closest&&e.target.closest("[data-ob]"); if(b) obStart(PROF); });

if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
</html>
